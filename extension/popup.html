<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="popup">
  <div id="setup" style="display:none">
    <p data-i18n="needSetup"></p>
    <button id="openOpts" class="primary" data-i18n="openSettings"></button>
  </div>
  <div id="form" style="display:contents">
    <label><span data-i18n="fTitle"></span><input id="title"></label>
    <div id="url" class="url"></div>
    <label><span data-i18n="fNote"></span><textarea id="note"></textarea></label>
    <div id="shot" class="shot"><img id="shotImg" alt=""><button id="shotDel" title="×">×</button></div>
    <div class="hint" data-i18n="pasteHint"></div>
    <div class="row">
      <button id="snap" data-i18n="snap"></button>
      <span class="spacer"></span>
      <button id="save" class="primary" data-i18n="save"></button>
    </div>
    <div id="msg" class="msg"></div>
  </div>
</div>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
