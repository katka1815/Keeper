<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#246A63" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Rozcestník" />
<title>Rozcestník</title>
<style>
  :root{--paper:#F4F2EB;--panel:#FBFAF6;--ink:#20262B;--muted:#6B7178;--line:#E4DECF;--lineSoft:#EDE8DC;
    --teal:#246A63;--plum:#5B3A57;--ok:#2E8B57;--broken:#C0392B;--unknown:#9A8F7A;--warn:#E08A2B;--warnBg:#FBEFDC;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  a{color:inherit} button{font-family:var(--sans);cursor:pointer}
  *:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  header.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;padding:22px 28px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--teal);font-weight:600}
  .mast h1{font-family:var(--serif);font-size:34px;line-height:1;margin:6px 0 0}
  .quote-wrap{margin-top:10px;display:flex;align-items:baseline;gap:8px;max-width:600px;min-height:22px}
  .quote{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--plum);transition:opacity .25s;line-height:1.4}
  .q-author{font-style:normal;font-size:12px;color:var(--muted)}
  .linkbtn{background:none;border:none;color:var(--muted);font-size:12px;opacity:.6}
  .linkbtn:hover{opacity:1;color:var(--teal)}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .health{display:flex;gap:13px;flex-wrap:wrap;font-size:13px}
  .health span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-size:13px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.danger{border-color:var(--broken);color:var(--broken)}
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn[disabled]{opacity:.5}
  .btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .lastcheck{font-size:12px;color:var(--muted);font-style:italic}
  .panel{display:none;margin:12px 28px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h3{font-family:var(--serif);margin:0 0 10px;color:var(--plum);font-size:16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--lineSoft)}
  .row:first-of-type{border-top:none}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--lineSoft);font-size:13px;flex-wrap:wrap}
  .set-row:first-of-type{border-top:none}
  select,input[type=text],input[type=date],textarea{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  textarea{width:100%;min-height:120px;resize:vertical;line-height:1.4}
  input[type=color]{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
  .bret{font-size:11px;padding:3px 5px}
  .filter{display:flex;gap:14px;align-items:center;padding:14px 28px 0;flex-wrap:wrap}
  .filter input[type=search]{flex:1;max-width:360px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:15px}
  .filter label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  section.block-card,.tasks,.inbox{margin:18px 28px 0;border-radius:12px;padding:16px}
  .tasks,.block-wrap{background:var(--panel);border:1px solid var(--line)}
  .block-wrap{margin:18px 28px 0;border-radius:12px;padding:16px}
  .block-wrap h2,.tasks h2,.inbox h2{font-family:var(--serif);font-size:18px;margin:0 0 10px;color:var(--plum)}
  .blocks{display:flex;flex-direction:column;gap:14px}
  .block{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
  .block.past{background:var(--warnBg);border-color:var(--warn)}
  .block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .block-title{font-family:var(--serif);font-size:16px;color:var(--plum);display:flex;align-items:center;gap:8px}
  .block-meta{font-size:12px;color:var(--muted)}
  .countdown{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  .countdown.past{color:var(--warn)}
  .cols{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;align-items:flex-start}
  .col{flex:1;min-width:220px}
  .col-done{display:flex;flex-direction:column;overflow:hidden}
  .col-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:6px}
  .item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--lineSoft)}
  .item:first-of-type{border-top:none}
  .item .t{flex:1;font-size:14px;word-break:break-word}
  .item.done-i .t{color:var(--muted)}
  .donelist{overflow:auto;min-height:60px}
  .col-done .donelist{flex:1}
  .caret{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 6px}
  .block.collapsed .cols{display:none}
  .bgrip{cursor:grab;color:var(--muted);font-size:14px;user-select:none}
  .areagrip{cursor:grab;color:var(--muted);font-size:14px;user-select:none;flex-shrink:0}
  .area.dragging{opacity:.4}
  .area.bover{outline:2px dashed var(--teal);outline-offset:2px}
  .area-move-arrows{display:none}
  @media (hover:none){.areagrip{display:none}.area-move-arrows{display:inline-flex}}
  .block.dragging{opacity:.4}
  .block.bover{outline:2px dashed var(--teal);outline-offset:2px}
  .tz-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff;min-width:220px}
  .tz-opt{padding:7px 10px;cursor:pointer;font-size:13px;border-top:1px solid var(--lineSoft)}
  .tz-opt:first-child{border-top:none}
  .tz-opt:hover{background:var(--paper)}
  .tz-opt.sel{color:var(--teal);font-weight:600}
  @media (max-width:640px){.col-done{height:auto !important}.donelist{max-height:300px}.areagrip{display:none}.area-move-arrows{display:inline-flex}}
  .badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--lineSoft);color:var(--muted);font-weight:600}
  .icon{background:none;border:none;color:var(--muted);font-size:14px;padding:6px 7px;border-radius:5px;line-height:1}
  .icon:hover{background:var(--paper);color:var(--ink)}
  .icon.good:hover{color:var(--ok)} .icon.danger:hover{color:var(--broken)} .icon[disabled]{opacity:.3}
  .add{margin-top:8px;width:100%;background:none;border:1px dashed var(--line);border-radius:8px;padding:9px;font-size:13px;color:var(--muted)}
  .add:hover{border-color:var(--teal);color:var(--teal)}
  .edit-inp{flex:1;font-size:14px;padding:5px 8px;border:1px solid var(--teal);border-radius:6px;background:#fff;color:var(--ink)}
  .empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:8px 4px}
  .inbox{background:#FBF6E8;border:1px solid #ECE0C2}
  .inbox h2{color:#7a5d1f}
  .inbox-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px;border-top:1px solid #efe3c6}
  .inbox-item:first-of-type{border-top:none}
  .quickadd{display:flex;gap:8px;align-items:center;margin:18px 28px 0;background:var(--card,#fff);border:1px solid var(--teal);border-radius:12px;padding:10px 12px}
  .quickadd input{flex:1;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .quickadd .qa-btn{flex:0 0 auto;font-size:18px;line-height:1;padding:8px 14px}
  .lend-row.ret .t,.row.ret .t{text-decoration:line-through;opacity:.55}
  .ix-type{font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:#efe3c6;color:#7a5d1f;padding:2px 7px;border-radius:5px}
  .ix-text{flex:1;min-width:140px;font-size:14px;word-break:break-word}.ix-text a{color:var(--teal)}
  main.board{display:flex;flex-wrap:wrap;gap:18px;padding:18px 28px 8px;align-items:flex-start}
.board.unified{display:block;column-width:290px;column-gap:18px}
.board.unified .area{display:inline-block;width:100%!important;height:auto!important;margin:0 0 18px;vertical-align:top;break-inside:avoid;-webkit-column-break-inside:avoid;resize:none}
.area{flex:0 0 auto;width:290px;min-width:200px;max-width:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.area>.links{flex:1 1 auto;min-height:0;overflow:auto}
.area:not([data-area-id]){height:auto!important}
.area-rz{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;opacity:.3;touch-action:none;background:linear-gradient(135deg,transparent 45%,var(--muted) 45%,var(--muted) 55%,transparent 55%,transparent 70%,var(--muted) 70%,var(--muted) 80%,transparent 80%)}
.area:hover .area-rz{opacity:.65}
.area.snapping{outline:2px solid var(--teal);outline-offset:-2px}
.board.unified .area-rz{display:none}
@media(max-width:640px){.area-rz{display:none}}
@media(max-width:640px){.area{resize:none;width:auto;flex:1 1 100%;height:auto!important;overflow:visible}}
#hiddenBar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 28px 0}
#boardBar{display:none;justify-content:flex-end;padding:14px 28px 0}
.area.collapsed .links,.area.collapsed .add{display:none}
.area.collapsed .area-head{border-bottom:0;margin-bottom:0;padding-bottom:0}
.area-head .caret{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px}
#hiddenBar.side{position:fixed;right:8px;top:88px;flex-direction:column;max-height:74vh;overflow:auto;padding:8px;z-index:40;max-width:190px;background:transparent}
.harea{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel);cursor:pointer;font-size:13px;white-space:nowrap}
.harea .hdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.harea .count{margin-left:2px}
@media(max-width:700px){#hiddenBar.side{position:static;flex-direction:row;max-height:none;max-width:none;padding:14px 16px 0}}
  .area{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .area.over{border-color:var(--teal);box-shadow:0 0 0 3px rgba(36,106,99,.12)}
  .area-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--lineSoft);margin-bottom:6px}
  .area-name{font-family:var(--serif);font-size:18px;margin:0;color:var(--plum);display:flex;align-items:center;gap:8px}
  .count{font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
  .ty{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .tools{display:flex;gap:1px;opacity:.4}.area:hover .tools{opacity:1}
  .link{display:flex;gap:11px;align-items:flex-start;padding:9px 6px;border-radius:8px;cursor:grab}
  .link:hover{background:var(--paper)} .link.dragging{opacity:.4}
  .fav{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-shrink:0;margin-top:1px;font-family:var(--serif);color:var(--plum);font-size:14px}
  .fav img{width:18px;height:18px;border-radius:3px;display:block}
  .lk-title{font-family:var(--serif);font-size:15px;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lk-title:hover{color:var(--teal);text-decoration:underline}
  .lk-meta{display:flex;align-items:center;gap:7px;margin-top:1px;flex-wrap:wrap}
  .host{font-family:var(--mono);font-size:11.5px;color:var(--muted)} .when{font-size:11px;color:var(--muted)}
  .bd{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;background:#FBEAE8;color:var(--broken)}
  .note{font-size:12.5px;color:var(--muted);margin-top:3px}
  .lk-tools{display:flex;gap:1px;opacity:0;flex-wrap:wrap;justify-content:flex-end;max-width:96px}.link:hover .lk-tools{opacity:1}
  footer{padding:18px 28px 36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:16px}
  @media (hover:none){.lk-tools,.tools{opacity:1}}
  @media (max-width:640px){.mast{flex-direction:column;align-items:flex-start;padding:18px 16px 14px}.right{align-items:flex-start;width:100%}.mast h1{font-size:28px}
    .filter,.board{padding-left:16px;padding-right:16px}.panel,.tasks,.inbox,.block-wrap,.quickadd{margin-left:16px;margin-right:16px}.lk-tools{opacity:1}}
</style>
</head>
<body>
<header class="mast">
  <div>
    <div class="eyebrow" id="eyebrow">OSOBNÍ ARCHIV</div>
    <h1 id="pageTitle">Rozcestník</h1>
    <div class="quote-wrap"><span id="quote" class="quote"></span><button class="linkbtn" data-act="toggle-quotes" id="qBtn">✎ citáty</button></div>
  </div>
  <div class="right">
    <div class="health" id="health"></div>
    <div class="acts">
      <button class="btn primary" id="checkAll">Zkontrolovat vše</button>
      <button class="btn" data-act="toggle-settings" id="setBtn">Nastavení</button>
      <button class="btn" data-act="toggle-trash" id="trashBtn">Koš</button>
      <button class="btn" data-act="toggle-cal" id="calHeaderBtn">Kalendář</button>
      <button class="btn" data-act="toggle-share" id="shareHeaderBtn">Sdílení</button>
      <button class="btn" data-act="toggle-faq" id="faqHeaderBtn">FAQ</button>
      <button class="btn" data-act="toggle-cycle" id="cycleHeaderBtn">Cyklus</button>
      <button class="btn" data-act="toggle-lend" id="lendHeaderBtn">Věci</button>
      <button class="btn" data-act="toggle-money" id="moneyHeaderBtn">Peníze</button>
      <button class="btn" data-act="toggle-watch" id="watchHeaderBtn">Hlídač</button>
      <button class="btn" data-act="toggle-book" id="bookHeaderBtn" style="display:none">Knihy</button>
    </div>
    <div class="lastcheck" id="lastcheck"></div>
  </div>
</header>

<div class="quickadd" id="quickAdd">
  <input type="text" id="quickTaskInput" placeholder="Rychlý úkol…" />
  <button class="btn primary qa-btn" data-act="quick-add-task" title="Přidat úkol">+</button>
</div>

<section class="panel" id="settingsPanel"></section>
<section class="panel" id="trashPanel"></section>
<section class="panel" id="quotesPanel">
  <h3 id="qTitle">Moje citáty <button class="linkbtn" data-act="close-panel" data-panel="quotesPanel" style="float:right;font-size:16px">×</button></h3>
  <textarea id="bulkQuotes" placeholder="Vlož citáty, každý na svůj řádek…"></textarea>
  <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
    <input type="text" id="bulkAuthor" placeholder="Autor (volitelně, pro celý seznam)" style="flex:1;min-width:180px"/>
    <button class="btn primary" data-act="add-quotes-bulk" id="addQuotesBtn">Přidat citáty</button>
  </div>
  <div id="quotesList" style="margin-top:10px"></div>
</section>

<section class="panel" id="newBlockPanel"></section>
<section class="panel" id="newAreaPanel"></section>
<section class="panel" id="calPanel"></section>
<section class="panel" id="sharePanel"></section>
<section class="panel" id="faqPanel"></section>
<section class="panel" id="cyclePanel"></section>
<section class="panel" id="lendPanel"></section>
<section class="panel" id="moneyPanel"></section>
<section class="panel" id="watchPanel"></section>
<section class="panel" id="bookPanel"></section>

<div class="filter">
  <input type="search" id="search" placeholder="Hledat v odkazech…" />
  <label><input type="checkbox" id="onlyBroken" /> <span id="obLabel">jen rozbité</span></label>
</div>

<section class="block-wrap"><h2 id="blocksTitle">Cíle a období</h2><div class="blocks" id="blocksEl"></div>
  <button class="add" data-act="add-block" id="addBlockBtn">+ Nový blok</button></section>

<section class="inbox" id="inbox" style="display:none"></section>
<div id="boardBar"></div>
<div id="hiddenBar" style="display:none"></div>
<main class="board" id="boardEl"></main>
<section class="tasks" id="tasksEl"></section>
<footer id="footer"></footer>

function local(ts,tz){let p={};try{const f=new Intl.DateTimeFormat("en-GB",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",weekday:"long"});for(const x of f.formatToParts(new Date(ts)))p[x.type]=x.value;}catch{const d=new Date(ts);p={year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),weekday:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]};}
  const y=+p.year,m=+p.month,d=+p.day,wd={Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Saturday:5,Sunday:6}[p.weekday];
  const dayIndex=Math.floor(Date.UTC(y,m-1,d)/86400000);return{y,m,d,wd,dayIndex,weekIndex:Math.floor((dayIndex-wd)/7),monthIndex:y*12+(m-1)};}
function periodsHanging(goal,block,tz){const a=local(goal.addedAt||Date.now(),tz),n=local(Date.now(),tz);const N=block.cycleN||1;
  if(block.cycleUnit==="week")return Math.max(0,Math.floor((n.weekIndex-a.weekIndex)/N));
  if(block.cycleUnit==="month")return Math.max(0,Math.floor((n.monthIndex-a.monthIndex)/N));
  return Math.max(0,Math.floor((n.dayIndex-a.dayIndex)/N));}
function dlFromInput(s){if(!s)return NaN;const d=new Date(s+"T00:00:00");if(isNaN(d.getTime()))return NaN;d.setDate(d.getDate()+1);return d.getTime();}
function dlToInput(ms){if(!ms||isNaN(ms))return "";const d=new Date(ms-1),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function countdown(deadline){const ms=deadline-Date.now(),past=ms<0,abs=Math.abs(ms),h=abs/3600000;
  if(h<48)return{past,text:(past?"-":"")+Math.max(0,Math.round(h))+L.hleft};return{past,text:(past?"-":"")+Math.round(h/24)+L.dleft};}

function conv(amount,cur,base){if(cur===base)return amount;if(!fxRates)return null;const rc=fxRates[cur],rb=fxRates[base];if(!rc||!rb)return null;return amount*rb/rc;}

/* ---------- lookups ---------- */
const A=id=>state.board.areas.find(a=>a.id===id);
const B=id=>state.board.blocks.find(b=>b.id===id);
async function runBatch(){
  const raw=$("bkBatch").value;const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  const a=A($("bkArea").value);if(!a)return;const lang=$("bkLang").value,fmt=$("bkFmt").value;const st=$("bookBatchStatus");let done=0,added=0;
  for(const line of lines){
    let title=line,author="";const si=line.indexOf("|");if(si>=0){title=line.slice(0,si).trim();author=line.slice(si+1).trim();}
    if(st)st.textContent=`${L.bookSearching} ${done+1}/${lines.length}`;
    try{
      const qs=new URLSearchParams({title,author,lang,fmt});
      const r=await api("/api/book/search?"+qs.toString());const res=((r&&r.results)||[]).filter(x=>!x.searchLink);
      const pick=res.find(x=>x.publicDomain&&x.fileUrl)||res.find(x=>x.publicDomain&&x.infoUrl)||res[0];
      if(pick){let url=pick.fileUrl||pick.infoUrl,note=pick.source||"";
        if(state.r2&&pick.fileUrl){try{const sv=await api("/api/book/save",{method:"POST",body:JSON.stringify({url:pick.fileUrl})});if(sv&&sv.url){url=sv.url;note=(pick.source||"")+" · soubor";}}catch(e){}}
        const t=(pick.title||title)+(pick.author?" — "+pick.author:"");
        if(a.type==="text")a.links.push({id:uid(),text:t});else a.links.push({id:uid(),title:t,url,note,status:"unknown",lastChecked:null,code:0});
        added++;}
    }catch(e){}
    done++;save();await new Promise(res=>setTimeout(res,300));
  }
  if(st)st.textContent=`${L.bookBatchDone}${added}/${lines.length}`;render();
}

function commitEdit(key,val){val=(val||"").trim();const p=key.split(":");
  if(p[0]==="task"){const x=state.board.tasks.find(t=>t.id===p[1]);if(x&&val)x.text=val;}
  else if(p[0]==="goal"){const b=B(p[1]);const g=b&&b.goals.find(x=>x.id===p[2]);if(g&&val)g.text=val;}
  else if(p[0]==="done"){const b=B(p[1]);const d=b&&b.done.find(x=>x.id===p[2]);if(d&&val)d.text=val;}
  else if(p[0]==="doing"){const b=B(p[1]);const d=b&&(b.doing||[]).find(x=>x.id===p[2]);if(d&&val)d.text=val;}
  else if(p[0]==="txt"){const a=A(p[1]);const it=a&&a.links.find(x=>x.id===p[2]);if(it&&val)it.text=val;}
  else if(p[0]==="q"){const it=state.board.quotes.find(x=>x.id===p[1]);if(it&&val)it.text=val;}
  save();render();}

  else if(act==="del-goal"){const b=B(blk),g=b.goals.find(x=>x.id===id);toTrash("goal",g.text,{block:b.id,item:g});b.goals=b.goals.filter(x=>x.id!==id);save();render();}
  else if(act==="add-done"){const b=B(id);const t=prompt(L.pDoneAdd);if(t&&t.trim()){b.done.unshift({id:uid(),text:t.trim(),doneAt:Date.now()});save();render();}}
  else if(act==="edit-done")startEdit("done:"+blk+":"+id);
  else if(act==="del-done"){const b=B(blk),d=b.done.find(x=>x.id===id);toTrash("done",d.text,{block:b.id,item:d});b.done=b.done.filter(x=>x.id!==id);save();render();}
  else if(act==="clear-done"){const b=B(id);if(b.done.length&&confirm("Vyčistit „"+L.done+"“?")){b.done.forEach(d=>toTrash("done",d.text,{block:b.id,item:d}));b.done=[];save();render();}}
  /* quotes */
  else if(act==="add-quotes-bulk"){const raw=$("bulkQuotes").value,au=$("bulkAuthor").value.trim(),sep=state.board.settings.quoteSep||"|";
    const lines=raw.split(/\r?\n/).map(s=>s.replace(/^\s*\d+[.)]\s*/,"").replace(/^\s*[-•·]\s*/,"").trim()).filter(Boolean);
    let n=0;lines.forEach(line=>{let text=line,author=au;if(sep&&sep!==","&&line.includes(sep)){const idx=line.lastIndexOf(sep);text=line.slice(0,idx).trim();author=line.slice(idx+sep.length).trim()||au;}state.board.quotes.push({id:uid(),text,author});n++;});
    if(n){$("bulkQuotes").value="";$("bulkAuthor").value="";save();renderQuotesList();setQuote();}}
  else if(act==="edit-quote"){const it=state.board.quotes.find(x=>x.id===id);const t=prompt("Citát:",it.text);if(t===null)return;const a=prompt("Autor:",it.author||"");it.text=t.trim()||it.text;it.author=(a||"").trim();save();renderQuotesList();}
  else if(act==="del-quote"){const it=state.board.quotes.find(x=>x.id===id);toTrash("quote",it.text,{item:it});state.board.quotes=state.board.quotes.filter(x=>x.id!==id);save();renderQuotesList();}
  /* inbox */
  else if(act==="file-link"){const it=state.inbox.find(i=>i.id===id);const a=A(document.querySelector('[data-sel="'+id+'"]').value);if(a){if(a.type==="text"){a.links.push({id:uid(),text:it.text||it.url});}else{const u=normUrl(it.url);a.links.push({id:uid(),title:it.text&&!/^https?:/i.test(it.text)?it.text:host(u),url:u,note:"",status:"unknown",lastChecked:null,code:0});}state.inbox=state.inbox.filter(i=>i.id!==id);save();render();}}
  else if(act==="file-task"){const it=state.inbox.find(i=>i.id===id);state.board.tasks.unshift({id:uid(),text:it.text,done:false});state.inbox=state.inbox.filter(i=>i.id!==id);save();render();}
  else if(act==="discard"){state.inbox=state.inbox.filter(i=>i.id!==id);save();render();}
  /* trash */
  else if(act==="restore"){const t=(state.board.trash||[]).find(x=>x.id===id);if(t){const pl=t.payload||{};
    if(t.kind==="task")state.board.tasks.push(pl.item);
    else if(t.kind==="quote")state.board.quotes.push(pl.item);
    else if(t.kind==="area")state.board.areas.push(pl.item);
    else if(t.kind==="block")state.board.blocks.push(pl.item);
    else if(t.kind==="goal"){const b=B(pl.block);if(b)b.goals.unshift(pl.item);}
    else if(t.kind==="done"){const b=B(pl.block);if(b)b.done.unshift(pl.item);}
    else if(t.kind==="doing"){const b=B(pl.block);if(b){b.doing=b.doing||[];b.doing.unshift(pl.item);}}
    else if(t.kind==="link"||t.kind==="txt"){const a=A(pl.area);if(a)a.links.push(pl.item);}
    else if(t.kind==="loan-out"||t.kind==="loan-in"){const dir=t.kind==="loan-out"?"out":"in";state.board.loans=state.board.loans||{out:[],in:[]};state.board.loans[dir]=state.board.loans[dir]||[];state.board.loans[dir].unshift({...pl.item,returned:false});}
    else if(t.kind==="debt"){state.board.debts=state.board.debts||[];state.board.debts.unshift({...pl.item,settled:false});}
    state.board.trash=state.board.trash.filter(x=>x.id!==id);save();render();}}
  else if(act==="empty-trash"){if(confirm("Vysypat koš?")){state.board.trash=[];save();renderTrash();}}
});

function rzSnap(val,cands,th){let best=val,bd=th;for(const c of cands){const d=Math.abs(c-val);if(d<bd){bd=d;best=c;}}return best;}
board.addEventListener("pointerdown",e=>{const h=e.target.closest(".area-rz");if(!h)return;if(state.board.settings.gridUnified)return;const ae=h.closest(".area[data-area-id]");if(!ae)return;e.preventDefault();
  const W=[],H=[];document.querySelectorAll('#boardEl .area[data-area-id]').forEach(o=>{if(o!==ae){W.push(o.offsetWidth);H.push(o.offsetHeight);}});
  const maxW=Math.max(220,(($("boardEl").clientWidth)||1200)-2);
  rz={id:ae.dataset.areaId,el:ae,sx:e.clientX,sy:e.clientY,sw:ae.offsetWidth,sh:ae.offsetHeight,W,H,maxW};
  try{h.setPointerCapture(e.pointerId);}catch(_){}});

  let w=Math.min(rz.maxW,Math.max(200,rz.sw+(e.clientX-rz.sx))),h=Math.max(80,rz.sh+(e.clientY-rz.sy));
  const ws=rzSnap(w,rz.W,9),hs=rzSnap(h,rz.H,9);const snapped=(ws!==w)||(hs!==h);w=ws;h=hs;
  rz.el.style.width=w+"px";rz.el.style.height=h+"px";rz.el.classList.toggle("snapping",snapped);});

function dayKeyOf(iso,allDay,tzN){if(allDay)return iso.slice(0,10);try{return new Intl.DateTimeFormat("en-CA",{timeZone:tzN,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));}catch{return(iso||"").slice(0,10);}}
function weekdayNames(){const cs=["po","út","st","čt","pá","so","ne"],en=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];const base=(L===DICT.en)?en:cs;return weekStart()===0?[base[6],...base.slice(0,6)]:base;}
function isoStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0).toISOString();}
function isoEndPlus(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0).toISOString();}
function monthGrid(cursor){const y=cursor.getFullYear(),m=cursor.getMonth(),ws=weekStart();
  const first=new Date(y,m,1),startOff=(first.getDay()-ws+7)%7;const gridStart=new Date(y,m,1-startOff);
  const last=new Date(y,m+1,0),endOff=6-((last.getDay()-ws+7)%7);const gridEnd=new Date(last);gridEnd.setDate(last.getDate()+endOff);
  const days=[],cur=new Date(gridStart);while(cur<=gridEnd){days.push(new Date(cur));cur.setDate(cur.getDate()+1);}
  return{days,from:isoStart(gridStart),to:isoEndPlus(gridEnd)};}
function weekGrid(cursor){const ws=weekStart(),off=(cursor.getDay()-ws+7)%7;const start=new Date(cursor);start.setDate(cursor.getDate()-off);
  const days=[];for(let i=0;i<7;i++){const dd=new Date(start);dd.setDate(start.getDate()+i);days.push(dd);}
  return{days,from:isoStart(days[0]),to:isoEndPlus(days[6])};}

function addDayKey(key,n){const d=new Date(key+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function eventDayKeys(ev,tzN){const sk=dayKeyOf(ev.start,ev.allDay,tzN);if(!ev.end)return[sk];
  let ek=dayKeyOf(ev.end,ev.allDay,tzN);
  if(ev.allDay)ek=addDayKey(ek,-1);
  else{try{if(new Intl.DateTimeFormat("en-GB",{timeZone:tzN,hourCycle:"h23",hour:"2-digit",minute:"2-digit"}).format(new Date(ev.end))==="00:00")ek=addDayKey(ek,-1);}catch(e){}}
  if(ek<sk)ek=sk;
  const keys=[];let k=sk,guard=0;while(k<=ek&&guard<400){keys.push(k);k=addDayKey(k,1);guard++;}return keys;}
function eventsByDay(){const map={},tzN=tz();
  for(const ev of calState.events){if(!ev.start)continue;const keys=eventDayKeys(ev,tzN);keys.forEach((k,i)=>{(map[k]=map[k]||[]).push({ev,start:i===0,span:keys.length>1});});}
  for(const k in map)map[k].sort((a,b)=>(a.ev.allDay?0:1)-(b.ev.allDay?0:1)||String(a.ev.start).localeCompare(String(b.ev.start)));return map;}

  return `<div class="cal-grid">${head}${cells}</div>`;}
function renderWeek(){const g=weekGrid(calState.cursor),byDay=eventsByDay(),tzN=tz(),wd=weekdayNames(),todayKey=fmtKey(new Date());
  const cells=g.days.map((d,i)=>{const key=fmtKey(d),evs=byDay[key]||[];

function newEventColor(p){const c=calCfg();const txt=((p.summary||"")+" "+(p.description||"")).toLowerCase();for(const r of c.rules){if(r.kw&&txt.includes(r.kw.toLowerCase()))return r.color;}let cat="timed";if(p.allDay)cat=(p.endDate&&p.endDate!==p.date)?"multiDay":"allDay";else{const sd=(p.start||"").slice(0,10),ed=(p.end||"").slice(0,10);cat=(sd&&ed&&sd!==ed)?"multiDay":"timed";}return c.colors[cat]||c.colors.timed;}
const GCAL_COLORS={1:"#7986cb",2:"#33b679",3:"#8e24aa",4:"#e67c73",5:"#f6bf26",6:"#f4511e",7:"#039be5",8:"#616161",9:"#3f51b5",10:"#0b8043",11:"#d50000"};
function hexRgb(h){h=String(h).replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function nearestGColor(hex){const[r,g,b]=hexRgb(hex);let best="1",bd=1e9;for(const id in GCAL_COLORS){const[R,G,B]=hexRgb(GCAL_COLORS[id]);const d=(r-R)*(r-R)+(g-G)*(g-G)+(b-B)*(b-B);if(d<bd){bd=d;best=id;}}return best;}

function calLoc(){return L===DICT.en?"en-GB":"cs-CZ";}
function calFmt(iso,allDay){if(!iso)return"";try{if(allDay){const d=new Date(iso.length<=10?iso+"T00:00:00":iso);return d.toLocaleDateString(calLoc(),{weekday:"short",day:"numeric",month:"short"});}return new Date(iso).toLocaleString(calLoc(),{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch{return iso;}}
function toInputLocal(iso,tzName){try{const f=new Intl.DateTimeFormat("en-GB",{timeZone:tzName,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});const p={};for(const x of f.formatToParts(new Date(iso)))p[x.type]=x.value;return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;}catch{return(iso||"").slice(0,16);}}
function subDay(d){try{const dt=new Date(d.slice(0,10)+"T00:00:00Z");dt.setUTCDate(dt.getUTCDate()-1);return dt.toISOString().slice(0,10);}catch{return d;}}
function defDT(addH){const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+addH);return toInputLocal(d.toISOString(),tz());}

  const areas=[...document.querySelectorAll(".shareArea:checked")].map(c=>c.value);
  const blocks=[...document.querySelectorAll(".shareBlock:checked")].map(c=>c.value);
  const includeTasks=!!($("shareTasks")&&$("shareTasks").checked);
  if(!areas.length&&!blocks.length&&!includeTasks){alert(L.shareMustPick);return;}
  const mode=document.querySelector("input[name=shareMode]:checked").value;
  const access=document.querySelector("input[name=shareAccess]:checked").value;
  const password=mode==="private"?($("sharePass").value||"").trim():"";
  if(mode==="private"&&!password){alert(L.shareMustPass);return;}
  const expiresInH=Number($("shareExpiry").value)||0,notify=$("shareNotify").checked,label=($("shareLabel").value||"").trim();
  btn.disabled=true;
  const r=await shareApi("/api/share/create",{method:"POST",body:JSON.stringify({label,areas,blocks,includeTasks,mode,access,password,expiresInH,notify})});
  btn.disabled=false;
  if(r.status===200){shareState.created={...r.body,mode};shareState.creating=false;await loadShares();}
  else alert("Sdílení: "+((r.body&&r.body.error)||r.status));}
async function revokeShare(token){if(!confirm(L.shareRevokeConfirm))return;await shareApi("/api/share/revoke",{method:"POST",body:JSON.stringify({token})});loadShares();}
async function extendShare(token){const h=Number($("extendSel").value)||0;const r=await shareApi("/api/share/extend",{method:"POST",body:JSON.stringify({token,expiresInH:h})});shareState.extendToken=null;if(r.status===200)loadShares();}

/* ---------- FAQ ---------- */
const FAQ={cs:[
  ["Musím kvůli tomu něco spouštět? Není to vir?",
   "V balíčku není žádný .exe ani nic jiného binárního. Všechno jsou textové soubory, které si můžeš před spuštěním otevřít v poznámkovém bloku a přečíst — a bez instalátoru se dá obejít úplně, jsou to tři příkazy v terminálu.",
   "Soubor „Click this to install the app.bat“ má tři řádky a nedělá nic než to, že spustí setup\\wizard.ps1 vedle sebe. Ten průvodce si nikdy nestahuje kód z internetu, aby ho spustil — žádné iex, žádné curl | bash. Jediné, co umí nainstalovat, je Node.js, a to přes winget, což je správce balíčků přímo od Microsoftu, oficiálním balíčkem OpenJS.NodeJS.LTS a až potom, co odpovíš a/n. Když odmítneš, jen ti otevře nodejs.org a zbytek necháš na sobě. Nástroj wrangler, kterým se appka nasazuje, se neinstaluje vůbec: pouští se přes npx --yes wrangler@latest, takže po sobě v systému nic trvalého nenechá. Na Cloudflare tě přihlásí jeho vlastním přihlašovacím oknem v prohlížeči, takže tvoje heslo nevidí ani průvodce, ani nikdo jiný. Jestli ti to i tak nesedí, přeskoč instalátor a v README je ruční postup: npm install -g wrangler, wrangler login, wrangler deploy."],
  ["Co to stojí?",
   "Nic. Běží to na free plánu Cloudflare, upozornění chodí přes ntfy, které je zdarma a nechce ani účet. Placený plán si to nevynutí.",
   "Cloudflare dává na free plánu 100 000 požadavků denně a cron jednou za hodinu, což je na osobní rozcestník řádově víc, než spotřebuješ. Jedna věc je na to postavená schválně: hlídač stránek má strop 25 stažení na jeden běh cronu, protože free plán dovolí 50 podrequestů na jedno spuštění — kdyby ten strop nebyl, narazíš na limit a Cloudflare tě tlačí k upgradu. Co se do rozpočtu nevejde, počká na další hodinu. Upozornění přes ntfy.sh jsou zdarma a bez registrace. E-mail přes Resend je nepovinný a má free tarif, který na pár zpráv měsíčně stačí, ale bez něj se nic nerozbije."],
  ["Kam jdou má data?",
   "Všechno leží v tvém vlastním Cloudflare účtu (úložiště KV), nikde jinde. Appka mluví jen s tvým Workerem a k autorovi appky neteče nic.",
   "Výjimky, kdy se sahá ven, jsou tyhle a žádné další: ikonky webů (favicony) se načítají z Googlu, kontrola odkazů navštěvuje tvoje uložené odkazy, Google Kalendář komunikuje s Googlem, když si ho propojíš, kurzy měn se jednou denně stahují z veřejného kurzovního API a hlídač stránek chodí na adresy, které jsi mu sama zadala. Ve všech případech odchází jen požadavek na stránku nebo na kurzy, ne tvoje jméno, e-mail ani obsah desky. Žádná analytika, žádné sledovací skripty, žádný server autora — ten o tvé existenci neví."],
  ["Můžu data smazat? Co se stane?",
   "Ano. Smazané věci jdou na 30 dní do Koše, pak zmizí; Koš můžeš vysypat hned. Smazat se dá i úplně všechno naráz.",
   "Koš drží položku i s tím, odkud pocházela, takže vrácení ji dá zpátky do správné oblasti nebo bloku. Po 30 dnech ji denní úklid zahodí nadobro. Když chceš skončit úplně, v Nastavení je vymazání celé desky a pak stačí ve svém Cloudflare účtu smazat Worker a KV úložiště — tím zmizí i poslední kopie. Nikdo jiný žádnou nemá, protože nikdy nikam neodešla."],
  ["Potřebuju heslo?",
   "Hlavní deska je záměrně bez hesla — je otevřená po adrese, tak si adresu nech pro sebe. Kalendář a cyklus jsou schované za PINem.",
   "Je to vědomé rozhodnutí, ne opomenutí: appka nemá účty ani přihlašování, protože je jednouživatelská a celé kouzlo je v tom, že ji otevřeš na jakémkoli zařízení bez cirkusu s hesly. Adresa je náhodná a nikde se nezveřejňuje, takže dokud ji někomu nepošleš, nikdo ji nenajde. Citlivé věci ale za tím pravidlem schované jsou: kalendář a záznamy o menstruačním cyklu vyžadují PIN, který se nastavuje jako secret na Workeru, a bez něj jsou ty funkce úplně vypnuté. Sdílené výřezy můžou mít navíc vlastní heslo."],
  ["Co když někdo získá odkaz?",
   "Hlavní adresa = vidí i mění celou tvou desku, ber ji jako klíč. Sdílený odkaz ke čtení = vidí jen tu výseč, kterou jsi mu poslala.",
   "Sdílený odkaz umí dvě nastavení, která je dobré nepomíchat. Ke čtení znamená, že příjemce vidí vybrané oblasti, cíle nebo úkoly a nic jiného; ke zbytku desky se přes ten odkaz nedostane. S úpravami může vybrané věci i měnit a mazat, což jsou tvoje opravdová data — proto se u téhle volby důrazně doporučuje heslo. Každé sdílení má vlastní platnost (24 hodin až neomezeně) a dá se kdykoli zrušit. Hlavní adresa nic takového nerozlišuje, ta je na všechno, takže ji posílej jen sobě."],
  ["Jak propojím kalendář?",
   "Jednorázově si v Google Cloud zapneš Calendar API, vytvoříš OAuth údaje a nastavíš tři secrety na Workeru. Krok za krokem je to v README.",
   "Token od Googlu leží jen na tvém Workeru v KV a do prohlížeče se nikdy neposílá. Kalendář je navíc celý schovaný za PINem (CAL_PIN) a dokud ten PIN nenastavíš, je funkce vypnutá a ani se nezobrazí. Propojení je obousměrné: události vidíš, zakládáš, měníš i mažeš. Když necháš projekt v Googlu v režimu Testing, vyžádá si Google nové přihlášení zhruba po týdnu — to není chyba appky, tak to má nastavené Google."],
  ["Jak funguje knihovna?",
   "Hledá knihy jen v legálních zdrojích (Project Gutenberg, Wikisource, Open Library / Internet Archive) a nabízí odkazy do knihoven.",
   "Žádné stínové knihovny, žádné obcházení zámků. U volných děl dostaneš rovnou soubor, u ostatních odkaz do Open Library nebo do knihovního katalogu, kde si knihu půjčíš normálně. Pozor na jednu věc, která se plete: volné dílo neznamená volný překlad — originál může být po autorských právech volný, ale konkrétní český překlad ještě chráněný. Odkazy na mlp.cz nebo Zlatý fond SME se proto nikdy nevybírají samy, jsou to jen prokliky do katalogu."],
  ["Jak funguje sdílení?",
   "Vytvoříš odkaz, který ukáže jen vybrané věci — oblasti, cíle, úkoly — ne celou stránku. Zvolíš, jestli je ke čtení, nebo i k úpravám.",
   "Odkaz je náhodný a neuhodnutelný, takže dokud ho nepošleš, nikdo ho nenajde. U soukromé varianty se navíc nastaví heslo, které se ukládá jen jako otisk, ne čitelně — pošli ho jiným kanálem než samotný odkaz. Každé sdílení má platnost 24 hodin, 7 dní, 30 dní, nebo bez konce, jde kdykoli prodloužit i zrušit a dávno prošlá se sama uklidí. Půjčené věci, dluhy, kalendář ani cyklus se sdílet nedají vůbec, do odkazu se nedostanou."],
  ["Jsou data o menstruačním cyklu soukromá?",
   "Ano. Na rozdíl od zbytku desky se neukládají do otevřeného obsahu, leží v samostatném klíči a jsou schovaná za stejným PINem jako kalendář.",
   "Do sdílených odkazů se nedostanou v žádné variantě a bez PINu je panel úplně nepřístupný. Když si necháš předpověď promítnout do Google Kalendáře, appka tě napřed výslovně upozorní, že tím ta data opouštějí tvůj Cloudflare a míří k Googlu jako ke třetí straně — a musíš to potvrdit. Překryv přímo v appce nic ven neposílá. Statistiky a předpovědi jsou orientační odhad z tvých vlastních záznamů, ne lékařská rada a rozhodně ne antikoncepce."],
  ["Co dělá Hlídač na cizích webech?",
   "Jednou za zvolený interval stáhne stránky, které jsi mu zadala, vyhodí z nich HTML a podívá se, jestli v textu není tvoje fráze.",
   "Respektuje robots.txt, představuje se hlavičkou Rozcestnik-Watcher/1.0, každé stránce dá deset vteřin a na jeden běh stáhne nejvýš 25 stránek — zbytek počká na další hodinu. Nic tam o tobě nenechává: neposílá jméno, e-mail ani obsah tvé desky, jen obyčejný požadavek na stránku, jaký by poslal kdokoli jiný. Co najde, uloží se jen k tobě do KV. Obsazenost představení ti říct neumí, protože tu si divadla dokreslují JavaScriptem až v prohlížeči a Worker JavaScript nespouští — místo nespolehlivého údaje dostaneš odkaz do prodeje."],
  ["Vidí někdo, co mám půjčené a komu dlužím?",
   "Věci i Peníze jsou součástí hlavní desky, a ta je otevřená po adrese — kdo adresu zná, vidí jména i částky a může je měnit.",
   "Na rozdíl od kalendáře a cyklu nejsou za PINem, takže tady je jedinou ochranou to, že adresu nikomu nedáš. Do sdíleného odkazu se ale nedostanou nikdy: sdílet jdou jen oblasti, cíle a úkoly. Kurzy měn se stahují z veřejného kurzovního API, kterému odchází jen dotaz na kurzy — žádná jména, žádné částky, nic z tvé desky."],
],en:[
  ["Do I have to run something? Is it a virus?",
   "There is no .exe in the package, and nothing else binary either. Every file is plain text you can open in a text editor and read before running it — and you can skip the installer entirely, it is three commands in a terminal.",
   "The file 'Click this to install the app.bat' is three lines long and does nothing but launch setup\\wizard.ps1 sitting next to it. The wizard never downloads code from the internet to execute — no iex, no curl | bash. The only thing it can install is Node.js, through winget, which is Microsoft's own package manager, using the official OpenJS.NodeJS.LTS package, and only after you answer y/n. Decline and it just opens nodejs.org and leaves the rest to you. Wrangler, the tool that deploys the app, is not installed at all: it runs through npx --yes wrangler@latest, so nothing permanent is added to your system. It signs you in to Cloudflare through Cloudflare's own browser login, so neither the wizard nor anyone else sees your password. If that still doesn't sit right, skip the installer — the README has the manual route: npm install -g wrangler, wrangler login, wrangler deploy."],
  ["What does it cost?",
   "Nothing. It runs on Cloudflare's free plan, and alerts go through ntfy, which is free and needs no account. It won't push you into a paid plan.",
   "Cloudflare's free plan gives you 100,000 requests a day and an hourly cron, which is orders of magnitude more than a personal dashboard uses. One thing is built around that deliberately: the page watcher is capped at 25 fetches per cron run, because the free plan allows 50 subrequests per invocation — without that cap you would hit the limit and Cloudflare would push you to upgrade. Whatever doesn't fit waits for the next hour. Alerts via ntfy.sh are free and require no signup. E-mail through Resend is optional and has a free tier that covers a few messages a month, but nothing breaks without it."],
  ["Where does my data go?",
   "Everything lives in your own Cloudflare account (KV storage), nowhere else. The app talks only to your Worker, and nothing goes to the app's author.",
   "The exceptions, and there are no others, are these: site icons (favicons) load from Google, link checking visits your own saved links, Google Calendar talks to Google if you connect it, exchange rates are fetched once a day from a public rates API, and the page watcher visits the addresses you gave it yourself. In every case what leaves is a request for a page or for rates — not your name, your e-mail or the contents of your board. No analytics, no tracking scripts, no author's server; the author doesn't know you exist."],
  ["Can I delete my data? What happens?",
   "Yes. Deleted items go to the Trash for 30 days, then disappear; you can empty the Trash right away. You can also wipe everything at once.",
   "The Trash keeps each item along with where it came from, so restoring puts it back in the right area or block. After 30 days the daily cleanup discards it for good. If you want out entirely, Settings has a wipe for the whole board, and then deleting the Worker and the KV namespace in your own Cloudflare account removes the last copy. Nobody else has one, because it never went anywhere."],
  ["Do I need a password?",
   "The main board is intentionally password-free — it's open by address, so keep the address to yourself. The calendar and the cycle sit behind a PIN.",
   "This is a deliberate choice, not an oversight: the app has no accounts and no login because it is single-user, and the whole point is that you open it on any device without a password circus. The address is random and published nowhere, so until you send it to someone, nobody will find it. The sensitive parts are behind that rule, though: the calendar and the menstrual cycle records require a PIN that is set as a Worker secret, and without it those features are switched off entirely. Shared slices can carry their own password on top."],
  ["What if someone gets the link?",
   "Main address = they see and edit your whole board, treat it like a key. A read-only share link = they see only the slice you sent them.",
   "A share link has two settings worth keeping straight. Read-only means the recipient sees the areas, goals or tasks you picked and nothing else; the rest of the board is unreachable through that link. Allow editing lets them change and delete those things, which is your real data — which is why a password is strongly recommended there. Every share has its own expiry (24 hours to never) and can be revoked at any time. The main address makes none of these distinctions; it is the key to everything, so send it only to yourself."],
  ["How do I connect the calendar?",
   "One time, you enable the Calendar API in Google Cloud, create OAuth credentials and set three secrets on your Worker. The README has it step by step.",
   "The Google token lives only on your Worker in KV and is never sent to the browser. The calendar is hidden behind a PIN (CAL_PIN), and until you set that PIN the feature is off and doesn't even appear. The connection is two-way: you can see, create, change and delete events. If you leave the Google project in Testing mode, Google will ask you to sign in again after about a week — that's Google's setting, not a bug in the app."],
  ["How does the library work?",
   "It searches books in legal sources only (Project Gutenberg, Wikisource, Open Library / Internet Archive) and offers links into libraries.",
   "No shadow libraries, no working around locks. For public-domain works you get the file directly; for everything else a link to Open Library or a library catalogue where you borrow the book normally. One thing that trips people up: a public-domain work does not mean a public-domain translation — the original may be free while a particular translation is still in copyright. That's why catalogue links are never selected for you automatically; they are only ways through to a library."],
  ["How does sharing work?",
   "You create a link that shows only selected things — areas, goals, tasks — not the whole page. You choose read-only or editable.",
   "The link is random and unguessable, so until you send it, nobody will find it. The private option adds a password, stored only as a hash and never in clear text — send it through a different channel than the link itself. Each share lasts 24 hours, 7 days, 30 days or forever, can be extended or revoked at any time, and long-expired ones clean themselves up. Lent items, debts, the calendar and the cycle cannot be shared at all; they never enter a share link."],
  ["Is my menstrual cycle data private?",
   "Yes. Unlike the rest of the board it isn't stored in the open content — it lives in a separate key behind the same PIN as the calendar.",
   "It never enters a share link in any variant, and without the PIN the panel is completely inaccessible. If you choose to project the prediction into Google Calendar, the app warns you explicitly first that this data is leaving your Cloudflare and going to Google as a third party, and you have to confirm. The in-app overlay sends nothing anywhere. The statistics and predictions are a rough estimate from your own records — not medical advice, and certainly not contraception."],
  ["What does the Watcher do on other people's sites?",
   "Once per chosen interval it fetches the addresses you gave it, strips the HTML and checks whether your phrase appears in the text.",
   "It honours robots.txt, identifies itself as Rozcestnik-Watcher/1.0, gives each page ten seconds and fetches at most 25 pages per run — the rest waits for the next hour. It leaves nothing of yours behind: no name, no e-mail, no board content, just an ordinary page request like anyone else's. Whatever it finds is stored only in your own KV. It cannot tell you whether seats are still available, because theatres render that with JavaScript in the browser and the Worker doesn't run JavaScript — instead of an unreliable answer you get the ticket link."],
  ["Can anyone see what I lent and what I owe?",
   "Items and Money are part of the main board, and that board is open by address — anyone who knows it sees the names and amounts and can change them.",
   "Unlike the calendar and the cycle they are not behind the PIN, so here the only protection is not giving the address away. They never enter a share link, though: only areas, goals and tasks can be shared. Exchange rates come from a public rates API, which receives nothing but a request for rates — no names, no amounts, nothing from your board."],
]};
// Z názvu položky udělej hledanou frázi: co je za pomlčkou nebo v závorce,
// bývá tvoje poznámka ("- doporučila aisha"), ne součást názvu inscenace.
function watchPhraseFromTitle(t){const x=String(t||"").trim();const m=x.match(/^(.*?)(?:\s[-\u2013\u2014\u00b7|]\s|\s\()/);return (m?m[1]:x).trim();}
function phraseOfLast(){const w=(state.board.watches||[])[0];return w?w.phrase:"";}
function watchForLink(areaId,l){
  const p=watchNorm(watchPhraseFromTitle(l.title||""));
  if(!p)return null;
  return (state.board.watches||[]).find(w=>w.areaId===areaId&&watchNorm(w.phrase)===p)||null;}
function watchNorm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
function watchItemName(it){return it.title||it.text||it.url||"";}
// Najdi v propojené oblasti položku, jejíž název odpovídá názvu hlídání.
// Nejdřív celá fráze jako podřetězec, pak všechna slova kdekoli v názvu.
function watchMatchEntry(w){
  if(!w||!w.areaId)return null;
  const a=(state.board.areas||[]).find(x=>x.id===w.areaId);
  if(!a)return{area:null,item:null};
  const needle=watchNorm(w.name||w.phrase||"");
  if(!needle)return{area:a,item:null};
  const items=a.links||[];
  for(const it of items){if(watchNorm(watchItemName(it)).includes(needle))return{area:a,item:it};}
  const words=needle.split(" ").filter(Boolean);
  if(words.length>1)for(const it of items){const hay=watchNorm(watchItemName(it));if(words.every(x=>hay.includes(x)))return{area:a,item:it};}
  return{area:a,item:null};}
function watchStampArea(w,d){
  const m=watchMatchEntry(w);
  if(!m||!m.item)return false;
  const line=L.watchNoteStamp.replace("{d}",watchDateLabel(d));
  const note=(m.item.note||"").trim();
  if(!note)m.item.note=line;
  else if(note.indexOf(line)<0)m.item.note=note+" · "+line;
  m.item.expiresDay=d.y*10000+d.m*100+d.d;
  return true;}
function watchDateLabel(d){const t=d.hh==null?esc(L.watchAllDay):d.hh+":"+String(d.mm).padStart(2,"0");return d.d+". "+d.m+". "+d.y+" · "+t;}
function watchPad(n){return String(n).padStart(2,"0");}
function watchEndOf(d){const t=Date.UTC(d.y,d.m-1,d.d,d.hh,d.mm)+150*60000;const e=new Date(t);return{y:e.getUTCFullYear(),m:e.getUTCMonth()+1,d:e.getUTCDate(),hh:e.getUTCHours(),mm:e.getUTCMinutes()};}
function watchGoogleUrl(hit,d){
  const p=watchPad;
  let dates;
  if(d.hh==null){const a=new Date(Date.UTC(d.y,d.m-1,d.d));const b=new Date(Date.UTC(d.y,d.m-1,d.d)+86400000);
    dates=a.getUTCFullYear()+p(a.getUTCMonth()+1)+p(a.getUTCDate())+"/"+b.getUTCFullYear()+p(b.getUTCMonth()+1)+p(b.getUTCDate());}
  else{const e=watchEndOf(d);
    dates=d.y+p(d.m)+p(d.d)+"T"+p(d.hh)+p(d.mm)+"00/"+e.y+p(e.m)+p(e.d)+"T"+p(e.hh)+p(e.mm)+"00";}
  const det=[hit.url,hit.ticketUrl||""].filter(Boolean).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(hit.name||"")
    +"&dates="+dates
    +"&details="+encodeURIComponent(det)
    +"&ctz="+encodeURIComponent(state.board.settings.tz||"Europe/Prague");}
function watchCalPayload(hit,d){
  const p=watchPad,tz=state.board.settings.tz||"Europe/Prague";
  const det=[hit.url,hit.ticketUrl||""].filter(Boolean).join("\n");
  if(d.hh==null)return{summary:hit.name||"",description:det,allDay:true,date:d.y+"-"+p(d.m)+"-"+p(d.d),endDate:d.y+"-"+p(d.m)+"-"+p(d.d),tz};
  const e=watchEndOf(d);
  return{summary:hit.name||"",description:det,tz,
    start:d.y+"-"+p(d.m)+"-"+p(d.d)+"T"+p(d.hh)+":"+p(d.mm)+":00",
    end:e.y+"-"+p(e.m)+"-"+p(e.d)+"T"+p(e.hh)+":"+p(e.mm)+":00"};}
let watchEditId=null;
function watchDayLabel(k){return k?String(k).replace(/(\d{4})(\d{2})(\d{2})/,"$3.$2.$1"):L.watchNever;}
function watchRowHtml(w){
  const b=state.board;
  if(watchEditId!==w.id){

  h+=`${T.avgCycle}: <b>${c.med} ${T.days}</b> <span class="when">(±${c.spread} · ${regLbl})</span><br>${T.avgPeriod}: <b>${c.avgPeriod} ${T.days}</b> · ${T.logged}: <b>${c.cycles} ${T.cyclesU}</b>`;
  if(c.win)h+=`<br>${T.nextPeriod}: <b>${esc(cycFmt(c.win.likely))}</b> <span class="when">(${T.between} ${esc(cycFmt(c.win.from))} – ${esc(cycFmt(c.win.to))})</span>`;
  if(c.pred.length>1)h+=`<br><span class="when">${T.more}: ${esc(cycFmt(c.pred[1]))}, ${esc(cycFmt(c.pred[2]))}</span>`;
  if(c.fertile)h+=`<br>${T.fertile}: <b>${esc(cycFmt(c.fertile.from))} – ${esc(cycFmt(c.fertile.to))}</b>`;
  if(c.ovul)h+=`<br>${T.ovul}: <b>${esc(cycFmt(c.ovul))}</b>`;
  h+=`</div>`;
  if(c.reg==="irr")h+=`<div class="empty" style="text-align:left;color:var(--broken)">${T.irrNote}</div>`;
  h+=`<div class="empty" style="text-align:left;color:var(--muted);margin-top:8px">${T.disclaimer}</div>`;
  return h;}
function cycList(){const T=cycT();const ps=[...cycleState.periods].filter(p=>p.start).sort((a,b)=>b.start.localeCompare(a.start));
  if(!ps.length)return `<div style="margin-top:10px"><b>${T.records}</b><div class="empty">${T.none}</div></div>`;
  return `<div style="margin-top:10px"><b>${T.records}</b>`+ps.map(p=>{const len=p.end?(daysBetween(p.start,p.end)+1)+" "+T.days:T.ongoing;return `<div class="row"><span class="t" style="font-size:13px">${esc(cycFmt(p.start))}${p.end?" – "+esc(cycFmt(p.end)):""} <span class="when">· ${len}</span>${p.skip?` <span class="when" style="color:var(--broken)">${T.skipBadge}</span>`:""}</span><span style="display:flex;gap:4px"><button class="icon" data-act="cyc-edit" data-id="${esc(p.id)}">✎</button><button class="icon danger" data-act="cyc-del" data-id="${esc(p.id)}">×</button></span></div>`;}).join("")+`</div>`;}
function renderCycle(){const p=$("cyclePanel");if(!p)return;const T=cycT();
  const close=`<button class="linkbtn" data-act="close-panel" data-panel="cyclePanel" style="float:right;font-size:16px">×</button>`;
  let body="";
  if(!cycleState.unlocked){
    body=`<div class="set-row" style="border:none"><span>${T.lock}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="password" id="cycPin" placeholder="${T.pinPh}" value="${esc(calState.pin||"")}" style="flex:1;min-width:160px"><button class="btn primary" data-act="cyc-unlock">${T.unlock}</button></div>${cycleState.err?`<div class="empty" style="color:var(--broken)">${esc(cycleState.err)}</div>`:""}`;
  }else if(cycleState.creating||cycleState.editId){
    body=cycForm();
  }else{
    const c=computeCycle(cycleState.periods),ongoing=cycOngoing();
    const navLabel=new Intl.DateTimeFormat(calLoc(),{month:"long",year:"numeric"}).format(cycleState.cursor);
    const actions=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="btn primary" data-act="cyc-logtoday">${T.logToday}</button>${ongoing?`<button class="btn" data-act="cyc-endtoday">${T.endToday}</button>`:""}<button class="btn" data-act="cyc-add">${T.add}</button><button class="btn" data-act="cyc-colors-toggle">${T.colorsBtn}</button></div>`;
    const bar=`<div class="cyc-bar"><div class="cyc-period">${esc(navLabel)}</div><div style="display:flex;gap:4px"><button class="btn" data-act="cyc-prev">‹</button><button class="btn" data-act="cyc-today">${L.calToday}</button><button class="btn" data-act="cyc-next">›</button></div></div>`;
    const main=`<div class="cyc-main"><div class="cyc-left">${bar}${cycMonthGrid(c)}${cycLegend()}</div><div class="cyc-right">${cycStats(c)}</div></div>`;
    body=actions+(cycleState.colorsOpen?cycColorsForm():"")+main+cycProject()+cycList();
  }
  p.innerHTML=`${CYC_CSS}<h3>🌸 ${T.title} ${close}</h3>${body}`;}
async function openCycle(){const p=$("cyclePanel");if(!p)return;p.style.display="block";cycleState.err="";if(!calState.pin)calState.pin=calPinLoad();renderCycle();
  if(!calState.pin)return;
  const r=await cycApi("/api/cycle/get");
  if(r.status===200){cycleState.periods=(r.body&&r.body.periods)||[];cycleState.unlocked=true;cycleState.err="";renderCycle();}
  else{cycleState.unlocked=false;cycleState.err=cycT().bad;calPinClear();renderCycle();}}
async function persistCycle(){const r=await cycApi("/api/cycle/save",{method:"POST",body:JSON.stringify({periods:cycleState.periods})});if(r.status!==200)alert("Cyklus: "+((r.body&&r.body.error)||r.status));renderCycle();}
function cycShift(n){const d=new Date(cycleState.cursor);d.setMonth(d.getMonth()+n);cycleState.cursor=d;renderCycle();}
async function cyclePushGoogle(){const T=cycT();const c=computeCycle(cycleState.periods);if(!c.pred.length){alert(T.needMore);return;}if(!confirm(T.projConfirm))return;
  let ok=0,reauth=false;
  for(const ns of c.pred){
    const r=await calApi("/api/cal/create",{method:"POST",body:JSON.stringify({summary:"🌸 "+T.evPeriod,allDay:true,date:ns,endDate:addDayKey(ns,Math.max(0,c.avgPeriod-1)),tz:tz(),description:T.evDesc})});
    if(r.status===200)ok++;else if(r.status===401&&r.body&&r.body.error==="reauth"){reauth=true;break;}
    const ov=addDayKey(ns,-14);
    const r2=await calApi("/api/cal/create",{method:"POST",body:JSON.stringify({summary:T.evOvul,allDay:true,date:ov,endDate:ov,tz:tz(),description:T.evDesc})});
    if(r2.status===200)ok++;else if(r2.status===401&&r2.body&&r2.body.error==="reauth"){reauth=true;break;}
  }
  alert(reauth?T.projNoConn:T.projDone.replace("{n}",ok));}

/* boot */
function normBoard(b){
  b.areas=b.areas||[];b.tasks=b.tasks||[];b.quotes=b.quotes||[];b.blocks=b.blocks||[];b.trash=b.trash||[];b.meta=b.meta||{};
  b.loans=b.loans||{out:[],in:[]};b.loans.out=b.loans.out||[];b.loans.in=b.loans.in||[];b.debts=Array.isArray(b.debts)?b.debts:[];b.watches=Array.isArray(b.watches)?b.watches:[];b.watchHits=Array.isArray(b.watchHits)?b.watchHits:[];
  b.settings=Object.assign({tz:tzGuess(),lang:"cs",dailyCleanup:"move",doneRetention:"week",quoteSep:"|",lastDailyKey:0,weekStart:"mon",areaScroll:true,gridUnified:false,hiddenPos:"top",title:"Rozcestník",areasMin:false,taskSort:"manual",baseCur:"CZK"},b.settings||{});
  b.settings.features=Object.assign({book:true},b.settings.features||{});
  b.areas.forEach(a=>{a.type=a.type||"links";a.links=a.links||[];a.color=a.color||"#5B3A57";});
  b.blocks.forEach(bl=>{bl.goals=bl.goals||[];bl.doing=bl.doing||[];bl.done=bl.done||[];bl.doneRetention=bl.doneRetention||"never";bl.color=bl.color||"#246A63";});
  return b;
}
async function refreshState(){
  if(editing||saveTimer)return;
  const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  try{const r=await api("/api/state");if(!r||!r.board)return;const s=JSON.stringify(r.board);if(s===lastBoardStr)return;state.board=normBoard(r.board);state.inbox=r.inbox||state.inbox;lastBoardStr=s;render();}catch(e){}
}
async function start(){
  try{const r=await api("/api/state");state={board:r.board||{},inbox:r.inbox||[],r2:!!(r&&r.r2)};}catch(e){state={board:{},inbox:[],r2:false};}
  normBoard(state.board);
  lastBoardStr=JSON.stringify(state.board);
  applyLang();render();setQuote();
  if(new URLSearchParams(location.search).get("cal")==="1"){openCal();}
  if(new URLSearchParams(location.search).get("shares")==="1"){openShare();}
}
start();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshState();});
window.addEventListener("focus",refreshState);
setInterval(refreshState,30000);
setInterval(setQuote,20*60*1000);
setInterval(()=>{if(!editing)renderBlocks();},60000); // odpočty
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
