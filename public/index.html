<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#246A63" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Rozcestník" />
<title>Rozcestník</title>
<style>
  :root{--paper:#ffffff;--panel:#ffffff;--ink:#252525;--muted:#666666;--caption:#767676;--line:#ebebeb;--lineStrong:#b5b5b5;--lineSoft:#f3f3f3;--flood:rgba(220,38,38,.35);
    /* --teal a --plum drzely akcent a nadpisy; v monochromu obe padaji na inkoust,
       cimz se jednim tahem zmonochromatizuje ~30 mist, ktera je pouzivala */
    --teal:var(--ink);--plum:var(--ink);--ok:var(--line);--broken:#7a2e2e;--unknown:transparent;--warn:#8e8e8e;--warnBg:var(--lineSoft);
    --r:8px;--gap:18px;--pad:28px;
    --serif:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;}
  /* Témata (settings.look): výchozí „Současné" je přesně :root výš a drží tvrdá pravidla
     z HANDOVERu. Duna a Zlatá hodina mění jen tokeny; tmavý režim (data-dark) má každé
     téma svůj. Zaoblení, hustota a písmo jsou samostatné přepínače. */
  :root[data-theme="duna"]{--paper:#f7f7f5;--panel:#ffffff;--ink:#1b0624;--muted:#766a7c;--caption:#898683;--line:#edece7;--lineStrong:#bdb8b3;--lineSoft:#f1f0ec}
  :root[data-theme="golden"]{--paper:#f2f0eb;--panel:#ffffff;--ink:#292827;--muted:#666666;--caption:#76716b;--line:#e3e3e2;--lineStrong:#b9b4ab;--lineSoft:#ebe8e1;--broken:#421d24}
  :root[data-dark="1"]{--paper:#121212;--panel:#1b1b1b;--ink:#ececec;--muted:#a3a3a3;--caption:#9a9a9a;--line:#2c2c2c;--lineStrong:#4f4f4f;--lineSoft:#232323;--broken:#e3a0a0;--warn:#8a8a8a;color-scheme:dark}
  :root[data-dark="1"][data-theme="duna"]{--paper:#120e14;--panel:#1b161d;--ink:#efe9f1;--muted:#aba1b0;--caption:#9d95a1;--line:#2e2731;--lineStrong:#564b5a;--lineSoft:#241e26}
  :root[data-dark="1"][data-theme="golden"]{--paper:#171412;--panel:#211d1a;--ink:#f2f0eb;--muted:#aca69d;--caption:#a09a90;--line:#342f2a;--lineStrong:#5a524b;--lineSoft:#2a2520;--broken:#e6a7b0}
  :root[data-radius="soft"]{--r:16px}:root[data-radius="soft"] .btn,:root[data-radius="soft"] .add,:root[data-radius="soft"] .ix-chip{border-radius:999px}
  :root[data-radius="sharp"]{--r:2px}
  :root[data-density="compact"]{--gap:10px;--pad:16px}:root[data-density="compact"] .link,:root[data-density="compact"] .item{padding-top:3px;padding-bottom:3px}
  :root[data-density="airy"]{--gap:28px;--pad:40px}:root[data-density="airy"] .link,:root[data-density="airy"] .item{padding-top:10px;padding-bottom:10px}
  :root[data-font="serif"]{--sans:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;--serif:var(--sans)}
  :root[data-font="mono"]{--sans:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;--serif:var(--sans)}
  :root[data-font="system"]{--sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--serif:var(--sans)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  a{color:inherit} button{font-family:var(--sans);cursor:pointer}
  *:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  header.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;padding:22px 28px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--caption);font-weight:500}
  .mast h1{font-family:var(--sans);font-size:15px;font-weight:500;line-height:1.4;margin:6px 0 0;color:var(--ink)}
  .quote-wrap{margin-top:10px;display:flex;align-items:baseline;gap:8px;max-width:600px;min-height:22px}
  .quote{font-family:var(--sans);font-style:italic;font-size:15px;color:var(--ink);transition:opacity .25s;line-height:1.4}
  .q-author{font-style:normal;font-size:12px;color:var(--muted)}
  .linkbtn{background:none;border:none;color:var(--muted);font-size:12px}
  .linkbtn:hover{opacity:1;color:var(--ink)}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .health{display:flex;gap:13px;flex-wrap:wrap;font-size:13px}
  .health span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .acts .grp{display:flex;gap:8px;flex-wrap:wrap}
  .acts .grp+.grp{border-left:1px solid var(--lineStrong);padding-left:8px}
  .health-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .btn.on{border-color:var(--ink);font-weight:500;background:var(--lineSoft)}
  .linkbtn.on{color:var(--ink);font-weight:500}
  .btn{font-size:13px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--lineStrong);background:var(--panel);color:var(--ink)}
.btn.danger{border-color:var(--broken);color:var(--broken)}
  .btn:hover{border-color:var(--ink);color:var(--ink)}
  .btn[disabled]{opacity:.5}
  .btn.primary{background:var(--panel);color:var(--ink);border-color:var(--ink)}
  .lastcheck{font-size:12px;color:var(--muted);font-style:italic}
  .panel{display:none;margin:12px 28px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .dock{display:none;margin:12px 28px 0}
  .dock.on{display:block}
  .dock-bar{display:flex;justify-content:flex-end;margin-bottom:8px}
  .dock-x{color:var(--broken);border-color:var(--broken)}
  .dock-x:hover{color:var(--broken);border-color:var(--broken);background:var(--flood)}
  .dock-grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .dock .panel{margin:0;position:relative;min-width:0}
  #dockGrid>.wide{grid-column:1/-1}
  .dock-grid::after,#dockGrid>*::after{content:"";position:absolute;inset:0;background:var(--flood);pointer-events:none;opacity:0;transition:opacity .12s;z-index:50}
  .dock.flood .dock-grid::after,#dockGrid>.flood::after{opacity:1}
  .panel h3 .linkbtn[data-act=close-panel]{color:var(--ink);font-size:20px!important;line-height:1;padding:0 6px;border-radius:var(--r)}
  .panel h3 .linkbtn[data-act=close-panel]:hover{color:var(--broken);background:var(--lineSoft)}
  @media (max-width:760px){.dock-grid{grid-template-columns:minmax(0,1fr)}}
  .panel h3{font-family:var(--sans);margin:0 0 12px;color:var(--ink);font-size:15px;font-weight:500}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--lineSoft)}
  .row:first-of-type{border-top:none}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--lineSoft);font-size:13px;flex-wrap:wrap}
  .set-row:first-of-type{border-top:none}
  .set-g{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:18px 0 2px}
  .set-g+.set-row{border-top:none}
  select,input[type=text],input[type=date],input[type=email],input[type=password],input[type=number],input[type=url],input[type=search],textarea{font-family:var(--sans);font-size:13px;padding:8px;border:1px solid var(--lineStrong);border-radius:var(--r);background:var(--panel);color:var(--ink)}
  textarea{width:100%;min-height:120px;resize:vertical;line-height:1.4}
  input[type=color]{width:26px;height:26px;border:1px solid var(--line);border-radius:var(--r);padding:0;background:none;cursor:pointer}
  .bret{font-size:11px;padding:3px 5px}
  .filter{display:flex;gap:14px;align-items:center;padding:14px 28px 0;flex-wrap:wrap}
  .filter input[type=search]{flex:1;max-width:360px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:14px}
  .filter label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  section.block-card,.tasks,.inbox{margin:18px 28px 0;border-radius:var(--r);padding:16px}
  .tasks,.block-wrap{background:var(--panel);border:1px solid var(--line)}
  .block-wrap{margin:18px 28px 0;border-radius:var(--r);padding:16px}
  .sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .sec-head h2{margin:0!important}
  .sec-ctl{display:inline-flex;gap:4px;align-items:center}
  .sec-b{background:none;border:1px solid var(--lineStrong);border-radius:var(--r);color:var(--ink);font-size:12px;padding:4px 8px;font-family:var(--sans)}
  .sec-b:hover{border-color:var(--ink)}
  .areas-wrap>.sec-head{margin:18px 28px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .sec-min>:not(.sec-head){display:none!important}
  /* Moduly z lišty na ploše: obal nese nadpis a ovládání, panel uvnitř je jen obsah. */
  .modsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:18px 28px 0;position:relative}
  .modsec .mod-title{font-family:var(--sans);font-size:15px;font-weight:500;margin:0;color:var(--ink)}
  .modsec>.sec-body>.panel{display:block;margin:0;border:0;border-radius:0;padding:0;background:none}
  .modsec>.sec-body>.panel>h3:first-of-type{display:none}
  .panel h3 .mod-page{float:right;margin:0 6px 0 0;font-weight:400}
  .sec-min{height:auto!important}
  .sec-min>.sec-head{margin-bottom:0}
  .areas-wrap.sec-min>.sec-head{border-bottom:0}
  #dockGrid>section{margin:0;background:var(--panel);border:1px solid var(--line);padding:16px;position:relative;min-width:0;width:auto!important;height:auto!important}
  #dockGrid>section .sec-rz,#dockGrid>section .sec-rz-x,#dockGrid>section .sec-rz-y{display:none}
  #dockGrid .areas-wrap>.sec-head{margin:0 0 12px;padding:0;border:0}
  #dockGrid .areas-wrap .filter,#dockGrid .areas-wrap .board,#dockGrid #boardBar,#dockGrid #hiddenBar{padding-left:0;padding-right:0}
  #dockGrid .sec-head .linkbtn[data-act=close-panel]{color:var(--ink);font-size:20px;line-height:1;padding:0 6px;border-radius:var(--r)}
  #dockGrid .sec-head .linkbtn[data-act=close-panel]:hover{color:var(--broken);background:var(--lineSoft)}
  .block-wrap h2,.tasks h2,.inbox h2,.areas-wrap h2{font-family:var(--sans);font-size:15px;font-weight:500;margin:0 0 12px;color:var(--ink)}
  .blocks{display:flex;flex-direction:column;gap:14px}
  .block{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel)}
  .block.past{background:var(--warnBg);border-color:var(--warn)}
  .block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .block-title{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}
  .block-meta{font-size:12px;color:var(--caption)}
  .countdown{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  .countdown.past{color:var(--warn)}
  .cols{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;align-items:flex-start}
  .col{flex:1;min-width:220px}
  .col-done{display:flex;flex-direction:column;overflow:hidden}
  .col-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:6px}
  .item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--lineSoft)}
  .item:first-of-type{border-top:none}
  .item .t{flex:1;font-size:14px;word-break:break-word}
  .item.done-i .t{color:var(--muted)}
  .donelist{overflow:auto;min-height:60px}
  .col-done .donelist{flex:1}
  .caret{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 6px}
  .block.collapsed .cols{display:none}
  .bgrip{cursor:grab;color:var(--muted);font-size:14px;user-select:none}
  .areagrip{cursor:grab;color:var(--muted);font-size:14px;user-select:none;flex-shrink:0}
  .area.dragging{opacity:.4}
  .area.bover{outline:2px dashed var(--teal);outline-offset:2px}
  .area-move-arrows{display:none}
  @media (hover:none){.areagrip{display:none}.area-move-arrows{display:inline-flex}}
  .block.dragging{opacity:.4}
  .block.bover{outline:2px dashed var(--teal);outline-offset:2px}
  .tz-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:6px;background:var(--panel);min-width:220px}
  .tz-opt{padding:7px 10px;cursor:pointer;font-size:13px;border-top:1px solid var(--lineSoft)}
  .tz-opt:first-child{border-top:none}
  .tz-opt:hover{background:var(--lineSoft)}
  .tz-opt.sel{color:var(--ink);font-weight:500}
  @media (max-width:640px){.col-done{height:auto !important}.donelist{max-height:300px}.areagrip{display:none}.area-move-arrows{display:inline-flex}}
  .badge{font-size:10px;padding:1px 6px;border-radius:var(--r);background:var(--lineSoft);color:var(--muted);font-weight:500}
  .icon{background:none;border:none;color:var(--caption);font-size:14px;padding:6px 8px;border-radius:var(--r);line-height:1}
  .icon:hover{background:var(--lineSoft);color:var(--ink)}
  .icon.good:hover{color:var(--ink)} .icon.danger:hover{color:var(--broken)} .icon[disabled]{opacity:.3}
  .add{margin-top:8px;width:100%;background:none;border:1px dashed var(--line);border-radius:var(--r);padding:9px;font-size:13px;color:var(--muted)}
  .add:hover{border-color:var(--ink);color:var(--ink)}
  .edit-inp{flex:1;font-size:14px;padding:6px 8px;border:1px solid var(--ink);border-radius:var(--r);background:var(--panel);color:var(--ink)}
  .empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:8px 4px}
  .inbox{background:var(--panel);border:1px solid var(--line)}
  .inbox h2{color:var(--ink)}
  .inbox-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px;border-top:1px solid var(--lineSoft)}
  .inbox-item:first-of-type{border-top:none}
  .ix-thumb{display:block;max-width:160px;max-height:100px;border:1px solid var(--line);margin-bottom:4px}
  .quickadd{display:flex;gap:8px;align-items:center;margin:18px 28px 0;background:var(--panel);border:1px solid var(--ink);border-radius:var(--r);padding:12px}
  .quickadd input{flex:1;font-size:14px;padding:9px 10px;border:1px solid var(--ink);border-radius:var(--r);background:var(--panel);color:var(--ink)}
  .quickadd input::placeholder{color:var(--muted);opacity:1}
  .quickadd .qa-btn{flex:0 0 auto;font-size:18px;line-height:1;padding:8px 14px}
  /* jedine plne tlacitko v appce: rychly ukol ma byt videt na prvni pohled */
  .quickadd .qa-btn.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .quickadd .qa-btn.btn.primary:hover{background:var(--ink);color:var(--paper)}
  .lend-row.ret .t,.row.ret .t{text-decoration:line-through;opacity:.55}
  .ix-type{font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--lineSoft);color:var(--muted);padding:2px 7px;border-radius:var(--r)}
  .ix-text{flex:1;min-width:140px;font-size:14px;word-break:break-word}.ix-text a{color:var(--ink)}
  .ix-tools{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
  .ix-chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px}
  .ix-chip{font:inherit;font-size:12px;border:1px solid var(--lineStrong);background:var(--panel);color:var(--caption);border-radius:var(--r);padding:2px 8px;cursor:pointer}
  .ix-chip.on{border-color:var(--ink);color:var(--ink);background:var(--lineSoft)}.ix-chip b{font-weight:500;color:var(--ink)}
  .ix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .ix-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:var(--panel);min-width:0}
  .ix-media{display:flex;align-items:center;justify-content:center;gap:8px;height:140px;background:var(--lineSoft);color:var(--caption);font-size:12px;overflow:hidden;text-decoration:none}
  .ix-media>img{width:100%;height:100%;object-fit:cover;display:block}.ix-noimg>img{width:24px;height:24px;object-fit:contain}
  .ix-txt{display:block;padding:12px;font-size:13px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word;align-items:flex-start;background:var(--panel);border-bottom:1px solid var(--lineSoft)}
  .ix-cb{padding:8px 12px 12px;font-size:13px;word-break:break-word;display:flex;flex-direction:column;gap:4px}.ix-ct a{color:var(--ink);font-weight:500}
  .ix-act{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px}.ix-act select{max-width:150px}.ix-card .ix-act select{flex:1 1 90px;min-width:0}
  .ix-sort{display:flex;flex-direction:column;gap:8px;max-width:560px}.ix-sort-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .ix-big .ix-media{height:260px}
  main.board{display:flex;flex-wrap:wrap;gap:var(--gap);padding:18px var(--pad) 8px;align-items:flex-start}
.board.unified{display:block;column-width:290px;column-gap:18px}
/* Volné rozložení (settings.areaFree): žádná mřížka, oblast leží tam, kam ji uživatelka
   položí (a.fx, a.fy), klidně přes jinou; navrch je ta naposled chycená (a.fz). */
.board.free{display:block;position:relative}
.board.free>.area{position:absolute;margin:0}
.board.free .area-head{cursor:grab}.board.free .area.moving{opacity:.92;outline:2px solid var(--ink);cursor:grabbing}
.board.free .area-move-arrows{display:none!important}
@media(max-width:640px){.board.free{height:auto!important;display:flex}.board.free>.area{position:static;width:auto!important}}
/* Mřížka z Pořádku: N stejně širokých sloupců, výška oblasti zůstává její. */
.board.gridded{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-items:start;gap:18px}
.board.gridded .area{width:auto;min-width:0;max-width:none}
@media(max-width:640px){.board.gridded{grid-template-columns:minmax(0,1fr)}.board.gridded .area{grid-column:auto!important;width:auto!important}}
.board.unified .area{display:inline-block;width:100%!important;height:auto!important;margin:0 0 18px;vertical-align:top;break-inside:avoid;-webkit-column-break-inside:avoid;resize:none}
.area{flex:0 0 auto;width:290px;min-width:200px;max-width:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.area>.links{flex:1 1 auto;min-height:0;overflow:auto}
.area:not([data-area-id]){height:auto!important}
.area-rz{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;opacity:.3;touch-action:none;background:linear-gradient(135deg,transparent 45%,var(--muted) 45%,var(--muted) 55%,transparent 55%,transparent 70%,var(--muted) 70%,var(--muted) 80%,transparent 80%)}
.area:hover .area-rz{opacity:.65}
section.block-wrap,section.tasks,section.inbox,section.areas-wrap{position:relative}
section.sized{overflow:hidden}
/* zmenšené sekce se skládají vedle sebe; roluje jen tělo */
section.sized{display:flex;flex-direction:column;max-width:100%}
section.sized>.sec-head{flex:0 0 auto}
section.sized>.sec-body{flex:1 1 auto;min-height:0;overflow:auto}
/* plocha: řady sekcí, které jdou přetahovat za nadpis */
#layout{padding:0 28px}
.lrow{display:flex;gap:18px;align-items:stretch;margin-top:18px}
.lrow>section{margin:0!important;flex:1 1 0;min-width:220px}
.lrow>section.sized[style*="width"]:not(.fit){flex:0 0 auto}
.lrow>section.fit{flex:1 1 0;contain:size;min-height:240px;width:auto!important;height:auto!important;display:flex;flex-direction:column;overflow:hidden}
.lrow>section.fit>.sec-head{flex:0 0 auto}
.lrow>section.fit>.sec-body{flex:1 1 auto;min-height:0;overflow:auto}
.lrow>section.fit.sec-min{contain:none;min-height:0}
.lrow>.areas-wrap>.sec-head{margin:0 0 12px}
.lrow>.areas-wrap .filter,.lrow>.areas-wrap .board,.lrow #boardBar,.lrow #hiddenBar{padding-left:0;padding-right:0}
.lrow>section>.sec-head{cursor:grab;user-select:none}
.lrow>section.lay-drag{opacity:.45}

  if(e2e&&path==="/api/state"&&opts.method==="PUT"&&typeof opts.body==="string")opts={...opts,body:JSON.stringify(await e2eSealState(JSON.parse(opts.body)))};
  const r=await fetch(path,{...opts,headers:{"content-type":"application/json",...(opts.headers||{})}}),j=await r.json();
  if(j&&j.shared)e2eShared=j.shared;
  return e2e?e2eOpen(j):j;}

const inboxKnown=new Set();
function noteInbox(){(state.inbox||[]).forEach(i=>inboxKnown.add(i.id));}
function mergeInbox(server){const fresh=(server||[]).filter(i=>i&&!inboxKnown.has(i.id));fresh.forEach(i=>inboxKnown.add(i.id));if(fresh.length)state.inbox=fresh.concat(state.inbox);return fresh.length;}
function stateBody(){noteInbox();return JSON.stringify({...state,inboxKnown:[...inboxKnown]});}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const body=stateBody();lastBoardStr=JSON.stringify(state.board);api("/api/state",{method:"PUT",body}).finally(()=>{saveTimer=null;});},400);}
function saveNow(){clearTimeout(saveTimer);saveTimer=null;const body=stateBody();lastBoardStr=JSON.stringify(state.board);return api("/api/state",{method:"PUT",body});}

const CURRENCIES=["CZK","EUR","USD","GBP","PLN"];
let fxRates=null,fxDay="";
async function ensureFx(){if(fxRates)return;try{const r=await api("/api/fx");if(r&&r.rates){fxRates=r.rates;fxDay=r.day||"";}}catch(e){}}
function conv(amount,cur,base){if(cur===base)return amount;if(!fxRates)return null;const rc=fxRates[cur],rb=fxRates[base];if(!rc||!rb)return null;return amount*rb/rc;}
function money(n,cur){const v=Math.round((n||0)*100)/100;return v.toLocaleString(L===DICT.en?"en":"cs",{minimumFractionDigits:0,maximumFractionDigits:2})+" "+cur;}

function renderLend(){const p=$("lendPanel");if(!p)return;const lo=state.board.loans||{out:[],in:[]};
  const sec=(title,arr,dir,whoPh)=>{
    const rows=arr.length?arr.map(it=>`<div class="row lend-row ${it.returned?"ret":""}"><span class="t" style="font-size:13.5px;flex:1;min-width:0"><b>${esc(it.who)}</b> · ${esc(it.item)}${it.date?` <span class="when">· ${esc(it.date)}</span>`:""}</span><button class="icon good" data-act="lend-ret" data-dir="${dir}" data-id="${it.id}" title="${L.lendReturned}">✓</button><button class="icon danger" data-act="lend-del" data-dir="${dir}" data-id="${it.id}">×</button></div>`).join(""):`<div class="empty">${L.lendEmpty}</div>`;

  p.innerHTML=`<h3>${L.lendTitle} ${close}</h3>${sec(L.lendOut,lo.out,"out",L.lendWhoOut)}${sec(L.lendIn,lo.in,"in",L.lendWhoIn)}`;}

function renderMoney(){const p=$("moneyPanel");if(!p)return;const base=state.board.settings.baseCur||"CZK";const ds=state.board.debts||[];
  const people={};
  ds.forEach(d=>{const k=(d.who||"").trim().toLowerCase()||"—";if(!people[k])people[k]={who:d.who||"—",net:0,items:[],unconv:false};const c=conv(d.amount,d.cur,base);if(!d.settled){if(c==null)people[k].unconv=true;else people[k].net+=(d.dir==="lent"?1:-1)*c;}people[k].items.push(d);});
  const curOpts=sel=>CURRENCIES.map(c=>`<option value="${c}" ${c===sel?"selected":""}>${c}</option>`).join("");
  const baseSel=`<select data-act="money-base">${curOpts(base)}</select>`;
  const fxNote=fxRates?`${L.moneyRates} ${esc(fxDay)}`:L.moneyNoRates;
  const addForm=`<div class="block" style="border-left:5px solid var(--plum);padding:12px;margin-top:8px"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input type="text" data-mf="who" placeholder="${L.moneyWho}" style="flex:1;min-width:100px"/><input type="number" step="0.01" data-mf="amount" placeholder="${L.moneyAmount}" style="width:100px"/><select data-mf="cur">${curOpts(base)}</select><select data-mf="dir"><option value="lent">${L.moneyLent}</option><option value="borrowed">${L.moneyBorrowed}</option></select><input type="date" data-mf="date" style="min-width:130px"/><input type="text" data-mf="note" placeholder="${L.moneyNote}" style="flex:1;min-width:100px"/><button class="btn primary" data-act="money-add">${L.moneyAdd}</button></div></div>`;
  const arr=Object.values(people).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
  const body=arr.length?arr.map(pp=>{const pos=pp.net>=0;const even=Math.abs(pp.net)<0.005&&!pp.unconv;const netTxt=(pp.unconv?"≈ ":"")+money(Math.abs(pp.net),base);const label=even?L.moneyEven:(pos?L.moneyOwesYou:L.moneyYouOwe);
    const items=pp.items.map(d=>{const c=conv(d.amount,d.cur,base);const cv=(c!=null&&d.cur!==base)?` <span class="when">(≈ ${money(c,base)})</span>`:"";return `<div class="row ${d.settled?"ret":""}"><span class="t" style="font-size:13px;flex:1;min-width:0">${d.dir==="lent"?"→":"←"} ${money(d.amount,d.cur)}${cv}${d.date?` <span class="when">· ${esc(d.date)}</span>`:""}${d.note?` · ${esc(d.note)}`:""}</span><button class="icon good" data-act="money-settle" data-id="${d.id}" title="${L.moneySettle}">✓</button><button class="icon danger" data-act="money-del" data-id="${d.id}">×</button></div>`;}).join("");
    return `<div class="block" style="border-left:5px solid ${even?"var(--muted)":(pos?"var(--teal)":"var(--broken)")};padding:10px;margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>${esc(pp.who)}</b><span style="color:${even?"var(--muted)":(pos?"var(--teal)":"var(--broken)")};font-weight:600">${label}${even?"":": "+netTxt}</span></div>${items}</div>`;}).join(""):`<div class="empty">${L.moneyEmpty}</div>`;
  const close=`<button class="linkbtn" data-act="close-panel" data-panel="moneyPanel" style="float:right;font-size:16px">×</button>`;
  p.innerHTML=`<h3>${L.moneyTitle} ${close}</h3><div class="set-row"><span>${L.moneyBase}</span><span>${baseSel} <span class="when" style="margin-left:6px">${fxNote}</span></span></div>${addForm}${body}`;}

function syncDoneHeights(){
  const mobile=window.innerWidth<=640;
  document.querySelectorAll("#blocksEl .block").forEach(bl=>{
    const cols=bl.querySelector(".cols");if(!cols)return;
    const left=cols.children[0],right=cols.querySelector(".col-done");if(!left||!right)return;
    if(mobile){right.style.height="";}else{right.style.height=Math.max(120,left.offsetHeight)+"px";}
  });
}

/* ---------- Ke zpracování: mřížka, roztřídění ----------
   Sem padá všechno nové: z rozšíření, z telefonu, z widgetu i přes Ctrl+V.
   Třídí se rovnou do oblastí, štítky nejsou (oblasti stačí). Roztřídit jde
   po jedné věci a klávesa 1–9 ji zařadí do očíslované oblasti. */
let ixSort=null,ixDupMap=new Map(),pvT=null;const ixPv={};
// Náhled dorazí později; překreslí se, až nikdo nepíše do políčka.
function pvRerender(){clearTimeout(pvT);pvT=setTimeout(()=>{const ae=document.activeElement;if(editing||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.id!=="search")){pvRerender();return;}renderInbox();if(state.board.areas.some(a=>a.view==="cards"))renderAreas();},300);}
function ixIsImg(it){return !!(it.type==="image"&&it.img);}
function ixIsLink(it){return ixIsImg(it)||it.type==="link"||!!it.url;}
function ixPreview(url){if(!url||!/^https?:/i.test(url))return null;if(ixPv[url])return ixPv[url];
  ixPv[url]="loading";fetch("/api/preview?url="+encodeURIComponent(url)).then(r=>r.json()).catch(()=>({})).then(p=>{ixPv[url]=p&&!p.error?p:{};pvRerender();});
  return "loading";}
function ixTitle(it){return ixIsLink(it)&&it.url?`<a href="${esc(it.url)}" target="_blank" rel="noreferrer">${esc(it.text||host(it.url))}</a>`:esc(it.text||"");}
function ixDupHtml(it){const a=it.url&&ixDupMap.get(dupKey(it.url));return a?`<div class="note ix-dup">${esc(lbT().dupIn)} „${esc(a.name)}“</div>`:"";}
function ixNote(it){return ixDupHtml(it)+libArtHint(it)+(it.note?`<div class="note">${esc(it.note)}</div>`:"")+(it.src?`<div class="note"><a href="${esc(it.src)}" target="_blank" rel="noreferrer">${esc(host(it.src))}</a></div>`:"");}
function ixAction(it,opts){return ixIsLink(it)?`<select data-sel="${it.id}">${opts}</select><button class="btn" data-act="file-link" data-id="${it.id}">${L.file}</button>`:`<button class="btn" data-act="file-task" data-id="${it.id}">${L.toTasks}</button>`;}
function ixThumb(it){
  if(ixIsImg(it))return `<a class="ix-media" href="/api/img/${esc(it.img)}" target="_blank" rel="noreferrer"><img src="/api/img/${esc(it.img)}" alt="" loading="lazy"/></a>`;
  if(ixIsLink(it)&&it.url){const pv=ixPreview(it.url),p=pv&&pv!=="loading"?pv:null,h=host(it.url);
    return p&&p.image?`<a class="ix-media" href="${esc(it.url)}" target="_blank" rel="noreferrer"><img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()"/></a>`
      :`<a class="ix-media ix-noimg" href="${esc(it.url)}" target="_blank" rel="noreferrer"><img src="/api/favicon?d=${encodeURIComponent(h)}" alt="" onerror="this.style.visibility='hidden'"/><span>${esc(h)}</span></a>`;}
  return `<div class="ix-media ix-txt">${esc((it.text||"").slice(0,280))}</div>`;}
function ixRow(it,opts){const body=ixIsImg(it)?`<a href="/api/img/${esc(it.img)}" target="_blank" rel="noreferrer"><img class="ix-thumb" src="/api/img/${esc(it.img)}" alt="" loading="lazy"/></a> ${ixTitle(it)}`:ixTitle(it);
  return `<div class="inbox-item"><span class="ix-type">${ixIsImg(it)?"img":ixIsLink(it)?"link":"note"}</span><span class="ix-text">${body}${ixNote(it)}</span>${ixAction(it,opts)}<button class="icon danger" data-act="discard" data-id="${it.id}">×</button></div>`;}
function ixCard(it,opts){return `<div class="ix-card">${ixThumb(it)}<div class="ix-cb">${ixIsLink(it)?`<div class="ix-ct">${ixTitle(it)}</div>`:""}${ixNote(it)}<div class="ix-act">${ixAction(it,opts)}<button class="icon danger" data-act="discard" data-id="${it.id}" title="${esc(L.ixDel)}">×</button></div></div></div>`;}
// Zařazení do oblasti. Poznámka bez adresy jde jen do textové oblasti.
function ixFile(it,a){if(!it||!a)return false;const img=ixIsImg(it)?location.origin+"/api/img/"+it.img:"";
  const ocr=it.ocr!==undefined?{ocr:it.ocr}:{};
  if(a.type==="text")a.links.push({id:uid(),text:[it.text||it.url,img,it.note].filter(Boolean).join("\n"),...ocr});
  else{const u=img||normUrl(it.url);if(!u)return false;a.links.push({id:uid(),title:it.text&&!/^https?:/i.test(it.text)?it.text:host(it.url||u),url:u,note:[it.note,img&&it.url].filter(Boolean).join(" · "),status:"unknown",lastChecked:null,code:0,...ocr});}
  state.inbox=state.inbox.filter(i=>i.id!==it.id);return true;}
function ixTargets(it){return state.board.areas.filter(a=>ixIsLink(it)||a.type==="text");}
function ixSortList(){const ids=new Set(state.inbox.map(i=>i.id));ixSort.ids=ixSort.ids.filter(id=>ids.has(id));if(ixSort.i>=ixSort.ids.length)ixSort.i=Math.max(0,ixSort.ids.length-1);return ixSort.ids;}
function ixSortHtml(opts){const ids=ixSortList();if(!ids.length){ixSort=null;return `<div class="empty">${L.ixSortDone}</div>`;}
  const it=state.inbox.find(i=>i.id===ids[ixSort.i]);

document.addEventListener("keydown",e=>{if(!ixSort||e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.closest&&e.target.closest("input,textarea,select,.edit-inp"))return;if(!document.querySelector("#inbox .ix-sort"))return;
  const q=s=>{const b=document.querySelector("#inbox .ix-sort "+s);if(b)b.click();};
  if(/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('#inbox .ix-sort [data-act="ix-sort-area"]')[+e.key-1];if(b){e.preventDefault();b.click();}}
  else if(e.key==="u"||e.key==="U"){e.preventDefault();q('[data-act="file-task"]');}
  else if(e.key==="Enter"||e.key==="ArrowRight"){e.preventDefault();q('[data-act="ix-sort-next"]');}
  else if(e.key==="ArrowLeft"||e.key==="Backspace"){e.preventDefault();q('[data-act="ix-sort-prev"]');}
  else if(e.key==="Delete"){e.preventDefault();q('[data-act="discard"]');}
  else if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();ixSort=null;renderInbox();}},true);

/* Ctrl+V: obrázek ze schránky (Win+Shift+S → Ctrl+V) se zmenší na 1600 px
   a WebP do ~300 kB, stejně jako v rozšíření, a uloží se do Ke zpracování.
   Obrázek se bere i s kurzorem v políčku; text jen mimo políčka, adresa jako
   odkaz, cokoli jiného jako poznámka. */
async function ixShrink(blob,max=1600){const bmp=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const toBlob=(type,q)=>new Promise(r=>c.toBlob(r,type,q));let out;
  for(const q of [0.82,0.7,0.55,0.4]){out=await toBlob("image/webp",q);if(!out||out.type!=="image/webp")out=await toBlob("image/jpeg",q);if(out&&out.size<300*1024)break;}
  return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(out);});}
async function ixCapture(payload){
  if(e2e&&payload.image&&lkInfo&&lkInfo.keys&&lkInfo.keys.pub){const m=String(payload.image).match(/^data:(image\/[a-z]+);base64,(.+)$/);
    if(m){const sealed=await e2eSealBytes(lkInfo.keys.pub,Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0)));let b="";for(let i=0;i<sealed.length;i+=0x8000)b+=String.fromCharCode.apply(null,sealed.subarray(i,i+0x8000));
      payload={...payload,image:undefined,imageSealed:btoa(b),imageType:m[1]};}}
  const r=await fetch("/api/capture",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});if(!r.ok)throw new Error("HTTP "+r.status);
  const st=await api("/api/state");if(st&&Array.isArray(st.inbox)&&mergeInbox(st.inbox))render();}

const A=id=>state.board.areas.find(a=>a.id===id);
const B=id=>state.board.blocks.find(b=>b.id===id);
async function runBatch(){
  const raw=$("bkBatch").value;const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  const a=A($("bkArea").value);if(!a)return;const lang=$("bkLang").value,fmt=$("bkFmt").value;const st=$("bookBatchStatus");let done=0,added=0;
  for(const line of lines){
    let title=line,author="";const si=line.indexOf("|");if(si>=0){title=line.slice(0,si).trim();author=line.slice(si+1).trim();}
    if(st)st.textContent=`${L.bookSearching} ${done+1}/${lines.length}`;
    try{
      const qs=new URLSearchParams({title,author,lang,fmt});
      const r=await api("/api/book/search?"+qs.toString());const res=((r&&r.results)||[]).filter(x=>!x.searchLink);
      const pick=res.find(x=>x.publicDomain&&x.fileUrl)||res.find(x=>x.publicDomain&&x.infoUrl)||res[0];
      if(pick){let url=pick.fileUrl||pick.infoUrl,note=pick.source||"";
        if(state.r2&&pick.fileUrl){try{const sv=await api("/api/book/save",{method:"POST",body:JSON.stringify({url:pick.fileUrl})});if(sv&&sv.url){url=sv.url;note=(pick.source||"")+" · soubor";}}catch(e){}}
        const t=(pick.title||title)+(pick.author?" — "+pick.author:"");
        if(a.type==="text")a.links.push({id:uid(),text:t});else a.links.push({id:uid(),title:t,url,note,status:"unknown",lastChecked:null,code:0});
        added++;}
    }catch(e){}
    done++;save();await new Promise(res=>setTimeout(res,300));
  }
  if(st)st.textContent=`${L.bookBatchDone}${added}/${lines.length}`;render();
}

   Otevřené panely se skládají do mřížky o dvou sloupcích. Nejnovější je vlevo,

const DOCK=["settingsPanel","trashPanel","quotesPanel","newBlockPanel","newAreaPanel","calPanel","sharePanel","faqPanel","cyclePanel","lendPanel","moneyPanel","watchPanel","bookPanel"];
const DOCK_BTN={blocksWrapEl:"blocksTabBtn",tasksEl:"tasksTabBtn",areasWrap:"areasTabBtn",settingsPanel:"setBtn",trashPanel:"trashBtn",quotesPanel:"qBtn",calPanel:"calHeaderBtn",sharePanel:"shareHeaderBtn",faqPanel:"faqHeaderBtn",cyclePanel:"cycleHeaderBtn",lendPanel:"lendHeaderBtn",moneyPanel:"moneyHeaderBtn",watchPanel:"watchHeaderBtn",bookPanel:"bookHeaderBtn"};

/* Sekce Cíle, Úkoly a Odkazy mají tři místa: rozbalené na ploše, sbalené na

   doku a otevírá se tlačítkem nahoře jako ostatní panely. Na plochu ji vrátí
   applyLayout do její řady. */
const PLACE={blocks:"blocksWrapEl",tasks:"tasksEl",areas:"areasWrap"};
function secMode(k){const m=(state.board.settings.secMode||{})[k];if(MOD[k])return m==="open"||m==="min"?m:"tab";return m==="min"||m==="tab"?m:"open";}
function setSecMode(k,m){const s=state.board.settings;s.secMode=Object.assign({},s.secMode,{[k]:m});save();render();}
function secCtl(k){const m=secMode(k);
  if(m==="tab")return `<button class="sec-b" data-act="sec-page" data-sec="${k}">⤓ ${L.secToPage}</button><button class="linkbtn" data-act="close-panel" data-panel="${PLACE[k]}">×</button>`;

function applySecModes(){const g=$("dockGrid");if(!g)return;
  for(const [k,id] of Object.entries(PLACE)){const el=$(id);if(!el)continue;const m=secMode(k);
    if(m==="tab"){if(el.parentNode!==g){el.style.display="none";g.appendChild(el);}el.classList.remove("sec-min");}
    else{if(el.parentNode===g){el.style.display="";$("layout").appendChild(el);}el.classList.toggle("sec-min",m==="min");}

/* ---------- moduly z lišty ----------
   Panely z horní lišty umí totéž co Cíle, Úkoly a Odkazy: ležet na ploše
   rozbalené nebo sbalené, nebo jen v liště (výchozí, tedy jak byly dřív).
   Na ploše panel bydlí v obalu section.modsec (#mod-<klíč>) s nadpisem a
   ovládáním, takže ho jde táhnout (LAY) a měnit mu velikost (SECS). Panel
   sám dál vykresluje svůj obsah do sebe, jen jeho vlastní nadpis se na
   ploše schová. Obsah se poprvé vykreslí „kliknutím“ na jeho tlačítko
   v liště, takže každý panel se otevře přesně tak, jak je zvyklý. */
const MOD={cal:"calPanel",cycle:"cyclePanel",watch:"watchPanel",lend:"lendPanel",money:"moneyPanel",book:"bookPanel",share:"sharePanel",quotes:"quotesPanel",trash:"trashPanel",settings:"settingsPanel",faq:"faqPanel"};
const MODW={};let modOpening=false;

function modWrap(k){if(MODW[k])return MODW[k];const w=document.createElement("section");w.className="modsec";w.id="mod-"+k;
  w.innerHTML=`<div class="sec-head"><h2 class="mod-title"></h2><span class="sec-ctl" data-sec="${k}"></span></div><div class="sec-body"></div>`;return MODW[k]=w;}

function applyModModes(){const g=$("dockGrid"),lay=$("layout");if(!g||!lay)return;
  for(const [k,pid] of Object.entries(MOD)){const p=$(pid);if(!p)continue;const w=modWrap(k),m=secMode(k);
    if(m==="tab"){if(p.parentNode!==g){p.style.display="none";g.appendChild(p);}if(w.parentNode)w.remove();}
    else{if(!w.parentNode)lay.appendChild(w);const body=w.querySelector(".sec-body");if(p.parentNode!==body)body.appendChild(p);

    modPageBtn(k);}
  layoutDock();applySecSizes();}
// V doku dostane nadpis panelu tlačítko „na plochu“ vedle křížku. Panely si
// nadpis přepisují, proto to hlídá MutationObserver na jejich obsahu.
function modPageBtn(k){const p=$(MOD[k]);if(!p)return;const h=p.querySelector(":scope>h3");if(!h)return;const has=h.querySelector(".mod-page");
  if(secMode(k)!=="tab"){if(has)has.remove();return;}if(has)return;

{const mo=new MutationObserver(recs=>{recs.forEach(r=>{const k=Object.keys(MOD).find(k=>MOD[k]===r.target.id);if(!k)return;

/* ---------- plocha: řady sekcí ----------

   Sekce puštěná vedle jiné dostane settings.secFit[k] a přizpůsobí se volnému
   místu v řadě; puštěná do vlastní řady fit ztratí a vrátí se k vlastní
   velikosti (settings.secSize). Kdo v řadě zůstane sám, fit ztratí taky. */
const LAY={inbox:["inbox",null],goals:["blocksWrapEl","blocks"],tasks:["tasksEl","tasks"],areas:["areasWrap","areas"]};
function layoutRows(set){const keys=Object.keys(LAY),seen=new Set();
  const rows=(Array.isArray(set.layout)?set.layout:[]).map(r=>(Array.isArray(r)?r:[]).filter(k=>keys.includes(k)&&!seen.has(k)&&seen.add(k)));
  keys.forEach(k=>{if(!seen.has(k))rows.push([k]);});

function layDrop(rows,fit,key,t){
  if(!t||!t.anchor||t.anchor===key)return null;
  rows=rows.map(r=>r.filter(k=>k!==key));fit=Object.assign({},fit);
  const ri=rows.findIndex(r=>r.includes(t.anchor));if(ri<0)return null;
  if(t.type==="newrow"){rows.splice(t.pos==="before"?ri:ri+1,0,[key]);delete fit[key];}
  else{rows[ri].splice(rows[ri].indexOf(t.anchor)+(t.pos==="after"?1:0),0,key);fit[key]=true;}

function applyLayout(){const box=$("layout");if(!box)return;const set=state.board.settings,fit=set.secFit||{};
  const want=lookRows(layoutRows(set)).map(r=>r.filter(k=>{const m=LAY[k][1];return !m||secMode(m)!=="tab";})).filter(r=>r.length);
  const rowEls=[...box.children].filter(x=>x.classList.contains("lrow"));
  while(rowEls.length<want.length){const d=document.createElement("div");d.className="lrow";box.appendChild(d);rowEls.push(d);}
  want.forEach((r,i)=>{const row=rowEls[i];
    r.forEach((k,j)=>{const el=$(LAY[k][0]);if(!el)return;el.dataset.lay=k;if(row.children[j]!==el)row.insertBefore(el,row.children[j]||null);});
    const shown=r.filter(k=>{const el=$(LAY[k][0]);return el&&el.style.display!=="none";});
    r.forEach(k=>{const el=$(LAY[k][0]);if(el)el.classList.toggle("fit",!!fit[k]&&shown.length>1);});});

// Kam by sekce dopadla: do řady vedle jiné sekce, nebo do nové řady nad/pod/mezi.
function layTargetNarrow(y,key){const box=$("layout").getBoundingClientRect();
  const items=[...$("layout").querySelectorAll(".lrow>section")].filter(c=>c.dataset.lay&&c.dataset.lay!==key&&c.style.display!=="none");
  if(!items.length)return null;
  let hit=items.find(c=>{const b=c.getBoundingClientRect();return y<b.top+b.height/2;}),pos="before";
  if(!hit){hit=items[items.length-1];pos="after";}
  const b=hit.getBoundingClientRect(),mates=[...hit.parentElement.children].filter(c=>c.dataset.lay&&c.dataset.lay!==key&&c.style.display!=="none");

  const keysOf=r=>[...r.children].filter(c=>c.dataset.lay&&c.dataset.lay!==key&&c.style.display!=="none");

      if(y>r.bottom-band)return {type:"newrow",anchor:items[0].dataset.lay,pos:"after",mark:{x:box.left,y:r.bottom+7,w:box.width,h:3}};
      const next=items.find(c=>{const b=c.getBoundingClientRect();return x<b.left+b.width/2;});
      if(next){const b=next.getBoundingClientRect();return {type:"row",anchor:next.dataset.lay,pos:"before",mark:{x:b.left-10,y:r.top,w:3,h:r.height}};}

const board=$("boardEl");let areaDrag=null;
// Šířka v mřížce je a.span v sloupcích, klidně necelých (1.6). Necelá oblast zabere
// celé sloupce do nejbližšího vyššího a šířkou se zkrátí; 18px je mezera desky.
function gridWp(span,cols){const sp=Math.min(span,cols),n=Math.ceil(sp-1e-6);return {n,w:sp<n-1e-6?`calc((100% + 18px) * ${+(sp/n).toFixed(4)} - 18px)`:""};}
function gridW(span,cols){const p=gridWp(span,cols);return `grid-column:span ${p.n};`+(p.w?`width:${p.w};`:"");}
/* Volné rozložení: přepnutí zapamatuje, kde oblasti právě jsou (nic neposkočí), oblast
   se chytá za hlavičku (mimo tlačítka) a pokládá kamkoli; deska je vysoká jako nejnižší oblast. */
function freeCapture(){const bd=$("boardEl"),b=bd.getBoundingClientRect();
  bd.querySelectorAll(":scope > .area[data-area-id]").forEach(el=>{const a=A(el.dataset.areaId);if(!a)return;const r=el.getBoundingClientRect();
    a.fx=Math.round(r.left-b.left-bd.clientLeft);a.fy=Math.round(r.top-b.top-bd.clientTop);if(!a.w)a.w=Math.round(el.offsetWidth);});}
function freeLayout(){const bd=$("boardEl");if(!bd||getComputedStyle(bd).display!=="block")return;let bottom=0,moved=false;
  const els=[...bd.querySelectorAll(":scope > .area[data-area-id]")];
  for(const el of els){const a=A(el.dataset.areaId);if(a&&a.fx!==undefined)bottom=Math.max(bottom,el.offsetTop+el.offsetHeight);}
  // oblast bez místa (nově vytvořená nebo znovu ukázaná) jde dolů pod ostatní
  for(const el of els){const a=A(el.dataset.areaId);if(!a||a.fx!==undefined)continue;
    a.fx=0;a.fy=bottom?bottom+18:0;el.style.left="0px";el.style.top=a.fy+"px";bottom=a.fy+el.offsetHeight;moved=true;}
  const add=bd.querySelector(":scope > .area:not([data-area-id])");if(add){add.style.left="0px";add.style.top=(bottom+18)+"px";bottom+=18+add.offsetHeight;}
  bd.style.height=(bottom+18)+"px";if(moved)save();}
let fmv=null;
board.addEventListener("pointerdown",e=>{if(!state.board.settings.areaFree||e.button!==0)return;const hd=e.target.closest(".area-head");if(!hd||e.target.closest("button,input,select,textarea,a"))return;
  const ae=hd.closest(".area[data-area-id]");if(!ae||getComputedStyle(ae).position!=="absolute")return;e.preventDefault();
  const top=Math.max(0,...state.board.areas.map(x=>x.fz||1))+1;ae.style.zIndex=top;ae.classList.add("moving");
  fmv={id:ae.dataset.areaId,el:ae,sx:e.clientX,sy:e.clientY,x:ae.offsetLeft,y:ae.offsetTop,z:top};try{hd.setPointerCapture(e.pointerId);}catch(_){}});
window.addEventListener("pointermove",e=>{if(!fmv)return;fmv.el.style.left=Math.max(0,fmv.x+e.clientX-fmv.sx)+"px";fmv.el.style.top=Math.max(0,fmv.y+e.clientY-fmv.sy)+"px";});
window.addEventListener("pointerup",()=>{if(!fmv)return;const g=fmv,a=A(g.id);fmv=null;g.el.classList.remove("moving");if(!a)return;
  a.fx=Math.round(g.el.offsetLeft);a.fy=Math.round(g.el.offsetTop);a.fz=g.z;save();freeLayout();});
let rz=null;
function rzSnap(val,cands,th){let best=val,bd=th;for(const c of cands){const d=Math.abs(c-val);if(d<bd){bd=d;best=c;}}return best;}
board.addEventListener("pointerdown",e=>{const h=e.target.closest(".area-rz,.area-rz-x,.area-rz-y");if(!h)return;if(state.board.settings.gridUnified)return;const ae=h.closest(".area[data-area-id]");if(!ae)return;e.preventDefault();

  const cells=days.map(d=>{const key=fmtKey(d),evs=byDay[key]||[],tk=(tasks[key]||[]).map(calTaskChip).join(""),wi=(d.getDay()-weekStart()+7)%7;

/* ---------- čitelnost textu na barevném podkladu ----------
   Relativní jas a kontrastní poměr podle WCAG. Běžný text potřebuje
   proti svému podkladu aspoň 4.5:1, tiché popisky 3:1. Když se na daný
   podklad nehodí inkoust, přepne se text na bílou, případně na šedou.

function readableOn(bg){
  try{

    if(contrastOn("#ffffff",bg)>=4.5)return "#ffffff";
    return contrastOn("#252525",bg)>=contrastOn("#ffffff",bg)?"#252525":"#ffffff";
  }catch(e){return "#252525";}}
// Tiché popisky snesou 3:1, ale musí být na stejné straně jako hlavní text:
// na tmavém podkladu světlá šedá, na světlém tmavá. Střední šedá na tmavém
// pozadí sice projde poměrem, ale vypadá zakaleně.

  try{

async function shareApi(path,opts={}){try{const r=await fetch(path,{...opts,headers:{"content-type":"application/json",...(opts.headers||{})}});let body={};try{body=await r.json();}catch(e){}return{status:r.status,body};}catch(e){return{status:0,body:{error:String(e)}};}}
function shareLinkOf(token){return location.origin+"/s/"+token;}
function shareFmtExp(ts){if(!ts)return L.shareNever;try{return new Date(ts).toLocaleString(calLoc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch{return"";}}
function expirySelect(id,sel){const o=[[24,L.shareExp24],[168,L.shareExp7],[720,L.shareExp30],[0,L.shareNever]];return `<select id="${id}">`+o.map(([h,t])=>`<option value="${h}" ${sel===h?"selected":""}>${t}</option>`).join("")+`</select>`;}
async function copyLink(link){try{await navigator.clipboard.writeText(link);toast(L.shareCopied);}catch{window.prompt(L.shareCopy,link);}}
async function sendLink(link){if(navigator.share){try{await navigator.share({title:"Rozcestník",url:link});}catch(e){}}else copyLink(link);}
function mailLink(link){location.href="mailto:?subject="+encodeURIComponent(L.shareMailSubject)+"&body="+encodeURIComponent(link);}
function shareCreateForm(){
  const areas=(state.board.areas||[]).map(a=>`<label class="set-row" style="cursor:pointer"><span>${esc(a.name)} <span class="when">(${a.type==="text"?L.shareTypeText:L.shareTypeLinks})</span></span><input type="checkbox" class="shareArea" value="${esc(a.id)}"></label>`).join("");
  const blocks=(state.board.blocks||[]).map(b=>`<label class="set-row" style="cursor:pointer"><span>${esc(b.name)}</span><input type="checkbox" class="shareBlock" value="${esc(b.id)}"></label>`).join("");
  return `<div class="block" style="border-left:5px solid var(--teal);padding:12px;margin-bottom:10px">
    <div class="set-row" style="border:none"><span>${L.shareLabel}</span><input type="text" id="shareLabel" style="flex:1;min-width:140px"></div>
    <div style="margin:8px 0 2px"><b>${L.shareAreas}</b></div>${areas||`<div class="empty">—</div>`}
    <div style="margin:8px 0 2px"><b>${L.shareBlocks}</b></div>${blocks||`<div class="empty">—</div>`}
    <label class="set-row" style="cursor:pointer"><span><b>${L.shareTasks}</b></span><input type="checkbox" id="shareTasks"></label>
    ${e2e?`<div class="set-row" style="align-items:flex-start"><span>${esc(lkT().shImg)}</span><span style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><label style="cursor:pointer"><input type="radio" name="shareImg" value="enc" checked> ${esc(lkT().shImgEnc)}</label><label style="cursor:pointer"><input type="radio" name="shareImg" value="plain"> ${esc(lkT().shImgPlain)}</label><span id="shareImgWarn" class="empty" style="display:none;text-align:left;margin:0;color:var(--broken)">⚠ ${esc(lkT().shImgWarn)}</span></span></div>`:""}
    <div class="set-row"><span>${L.shareAccess}</span><span><label style="margin-right:12px;cursor:pointer"><input type="radio" name="shareAccess" value="read" checked> ${L.shareAccessRead}</label><label style="cursor:pointer"><input type="radio" name="shareAccess" value="edit"> ${L.shareAccessEdit}</label></span></div>
    <div class="set-row"><span>${L.shareMode}</span><span><label style="margin-right:12px;cursor:pointer"><input type="radio" name="shareMode" value="obscure" checked> ${L.shareModeObscure}</label><label style="cursor:pointer"><input type="radio" name="shareMode" value="private"> ${L.shareModePrivate}</label></span></div>
    <div class="set-row" id="sharePassRow" style="display:none"><span>${L.sharePass}</span><input type="text" id="sharePass" style="flex:1;min-width:140px"></div>
    <div class="set-row"><span>${L.shareExpiry}</span>${expirySelect("shareExpiry",168)}</div>
    <label class="set-row" style="cursor:pointer"><span>${L.shareNotify}</span><input type="checkbox" id="shareNotify"></label>
    <div class="empty" id="shareWarn" style="text-align:left;color:var(--muted)">${L.shareWarnObscure}</div>
    <div style="margin-top:10px"><button class="btn primary" data-act="share-create">${L.shareCreate}</button> <button class="btn" data-act="share-cancel">${L.shareCancel}</button></div></div>`;}
function shareCreatedBox(){const u=shareState.created.url,priv=shareState.created.mode==="private";
  return `<div class="block" style="border-left:5px solid var(--ok);padding:12px;margin-bottom:10px"><b>${L.shareCreate} ✓</b>
    <div class="set-row"><span>${L.shareLink}</span><input type="text" readonly value="${esc(u)}" style="flex:1;min-width:140px" onclick="this.select()"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn primary" data-act="share-copy" data-link="${esc(u)}">${L.shareCopy}</button><button class="btn" data-act="share-send" data-link="${esc(u)}">${L.shareSend}</button><button class="btn" data-act="share-mail" data-link="${esc(u)}">${L.shareMail}</button><button class="btn" data-act="share-done">OK</button></div>
    <div class="empty" style="text-align:left;color:var(--muted);margin-top:8px">${priv?L.shareWarnPrivate:L.shareWarnObscure}</div></div>`;}
function shareRow(s){const link=shareLinkOf(s.token),expd=s.expiresAt&&Date.now()>s.expiresAt;
  if(shareState.extendToken===s.token)return `<div class="block" style="padding:10px;margin-bottom:6px"><b>${esc(s.label||L.shareLink)}</b><div class="set-row"><span>${L.shareExpiry}</span>${expirySelect("extendSel",168)}</div><div style="margin-top:8px"><button class="btn primary" data-act="share-extend-do" data-token="${esc(s.token)}">${L.shareExtend}</button> <button class="btn" data-act="share-extend-cancel">${L.shareCancel}</button></div></div>`;
  return `<div class="row" style="flex-wrap:wrap;gap:6px"><span class="t" style="font-size:13px"><b>${esc(s.label||L.shareLink)}</b> ${s.mode==="private"?`<span class="when">${L.shareHasPass}</span>`:""}${s.access==="edit"?` <span class="when" style="color:var(--broken)">${L.shareEditBadge}</span>`:""}<br><span class="when">${L.shareExpires}: ${expd?L.shareExpiredTxt:shareFmtExp(s.expiresAt)}</span></span><span style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"><button class="btn" data-act="share-copy" data-link="${esc(link)}">${L.shareCopy}</button><button class="btn" data-act="share-send" data-link="${esc(link)}">${L.shareSend}</button><button class="btn" data-act="share-extend" data-token="${esc(s.token)}">${L.shareExtend}</button><button class="icon danger" data-act="share-revoke" data-token="${esc(s.token)}">×</button></span></div>`;}
function renderShare(){const p=$("sharePanel");if(!p)return;
  const close=`<button class="linkbtn" data-act="close-panel" data-panel="sharePanel" style="float:right;font-size:16px">×</button>`;
  let body="";
  if(shareState.creating)body+=shareCreateForm();
  if(shareState.created)body+=shareCreatedBox();
  const top=(shareState.creating||shareState.created)?"":`<button class="add" data-act="share-new">${L.shareNew}</button>`;
  const list=!shareState.list.length?`<div class="empty">${L.shareNone}</div>`:shareState.list.map(shareRow).join("");
  body+=`<div style="margin-top:6px">${list}</div>`;
  p.innerHTML=`<h3>${L.shareTitle} ${close}</h3>${top}${body}`;
  if(shareState.creating){const upd=()=>{const priv=document.querySelector("input[name=shareMode]:checked").value==="private";const edit=document.querySelector("input[name=shareAccess]:checked").value==="edit";$("sharePassRow").style.display=priv?"":"none";$("shareWarn").textContent=(edit?L.shareWarnEdit+" ":"")+(priv?L.shareWarnPrivate:L.shareWarnObscure);};document.querySelectorAll("input[name=shareMode],input[name=shareAccess]").forEach(r=>r.onchange=upd);}}
async function openShare(){const p=$("sharePanel");if(!p)return;p.style.display="block";shareState.creating=false;shareState.created=null;shareState.extendToken=null;renderShare();await loadShares();}
async function loadShares(){const r=await shareApi("/api/share/list");if(r.status===200){shareState.list=r.body.shares||[];renderShare();}}
async function createShare(btn){
  const areas=[...document.querySelectorAll(".shareArea:checked")].map(c=>c.value);
  const blocks=[...document.querySelectorAll(".shareBlock:checked")].map(c=>c.value);
  const includeTasks=!!($("shareTasks")&&$("shareTasks").checked);
  if(!areas.length&&!blocks.length&&!includeTasks){alert(L.shareMustPick);return;}
  const mode=document.querySelector("input[name=shareMode]:checked").value;
  const access=document.querySelector("input[name=shareAccess]:checked").value;
  const password=mode==="private"?($("sharePass").value||"").trim():"";
  if(mode==="private"&&!password){alert(L.shareMustPass);return;}
  const expiresInH=Number($("shareExpiry").value)||0,notify=$("shareNotify").checked,label=($("shareLabel").value||"").trim();
  const si=document.querySelector("input[name=shareImg]:checked"),images=!!si&&si.value==="plain";
  if(images&&!confirm(lkT().shImgWarn))return;
  btn.disabled=true;
  const r=await shareApi("/api/share/create",{method:"POST",body:JSON.stringify({label,areas,blocks,includeTasks,images,mode,access,password,expiresInH,notify})});
  btn.disabled=false;
  if(r.status===200){shareState.created={...r.body,mode};shareState.creating=false;
    // sdílené věci musí na serveru ležet čitelně, jinak by je příjemce neviděl
    e2eShared={areas:[...e2eShared.areas,...(areas||[])],blocks:[...e2eShared.blocks,...(blocks||[])],tasks:e2eShared.tasks||!!includeTasks};if(e2e){saveNow();if(images)e2eUnsealForShare(areas);}
    await loadShares();}
  else alert("Sdílení: "+((r.body&&r.body.error)||r.status));}
async function revokeShare(token){if(!confirm(L.shareRevokeConfirm))return;await shareApi("/api/share/revoke",{method:"POST",body:JSON.stringify({token})});loadShares();
  if(e2e){await api("/api/state");saveNow();e2eSealImagesLoop();}} // už nesdílené se zase zašifruje
async function extendShare(token){const h=Number($("extendSel").value)||0;const r=await shareApi("/api/share/extend",{method:"POST",body:JSON.stringify({token,expiresInH:h})});shareState.extendToken=null;if(r.status===200)loadShares();}

/* ---------- FAQ ---------- */
const FAQ={cs:[
  ["Musím kvůli tomu něco spouštět? Není to vir?",
   "V balíčku není žádný .exe ani nic jiného binárního. Všechno jsou textové soubory, které si můžeš před spuštěním otevřít v poznámkovém bloku a přečíst — a bez instalátoru se dá obejít úplně, jsou to tři příkazy v terminálu.",
   "Soubor „Click this to install the app.bat“ má tři řádky a nedělá nic než to, že spustí setup\\wizard.ps1 vedle sebe. Ten průvodce si nikdy nestahuje kód z internetu, aby ho spustil — žádné iex, žádné curl | bash. Jediné, co umí nainstalovat, je Node.js, a to přes winget, což je správce balíčků přímo od Microsoftu, oficiálním balíčkem OpenJS.NodeJS.LTS a až potom, co odpovíš a/n. Když odmítneš, jen ti otevře nodejs.org a zbytek necháš na sobě. Nástroj wrangler, kterým se appka nasazuje, se neinstaluje vůbec: pouští se přes npx --yes wrangler@latest, takže po sobě v systému nic trvalého nenechá. Na Cloudflare tě přihlásí jeho vlastním přihlašovacím oknem v prohlížeči, takže tvoje heslo nevidí ani průvodce, ani nikdo jiný. Jestli ti to i tak nesedí, přeskoč instalátor a v README je ruční postup: npm install -g wrangler, wrangler login, wrangler deploy."],
  ["Co to stojí?",
   "Nic. Běží to na free plánu Cloudflare, upozornění chodí přes ntfy, které je zdarma a nechce ani účet. Placený plán si to nevynutí.",
   "Cloudflare dává na free plánu 100 000 požadavků denně a cron jednou za hodinu, což je na osobní rozcestník řádově víc, než spotřebuješ. Jedna věc je na to postavená schválně: hlídač stránek má strop 25 stažení na jeden běh cronu, protože free plán dovolí 50 podrequestů na jedno spuštění — kdyby ten strop nebyl, narazíš na limit a Cloudflare tě tlačí k upgradu. Co se do rozpočtu nevejde, počká na další hodinu. Upozornění přes ntfy.sh jsou zdarma a bez registrace. E-mail přes Resend je nepovinný a má free tarif, který na pár zpráv měsíčně stačí, ale bez něj se nic nerozbije."],
  ["Kam jdou má data?",
   "Všechno leží v tvém vlastním Cloudflare účtu (úložiště KV), nikde jinde. Appka mluví jen s tvým Workerem a k autorovi appky neteče nic.",
   "Výjimky, kdy se sahá ven, jsou tyhle a žádné další: ikonky webů (favicony) stahuje tvůj server přímo z těch webů, kontrola odkazů navštěvuje tvoje uložené odkazy, Google Kalendář komunikuje s Googlem, když si ho propojíš, kurzy měn se jednou denně stahují z veřejného kurzovního API a hlídač stránek chodí na adresy, které jsi mu sama zadala. Ve všech případech odchází jen požadavek na stránku nebo na kurzy, ne tvoje jméno, e-mail ani obsah desky. Žádná analytika, žádné sledovací skripty, žádný server autora — ten o tvé existenci neví."],
  ["Můžu data smazat? Co se stane?",
   "Ano. Smazané věci jdou na 30 dní do Koše, pak zmizí; Koš můžeš vysypat hned. Smazat se dá i úplně všechno naráz.",
   "Koš drží položku i s tím, odkud pocházela, takže vrácení ji dá zpátky do správné oblasti nebo bloku. Po 30 dnech ji denní úklid zahodí nadobro. Když chceš skončit úplně, v Nastavení je vymazání celé desky a pak stačí ve svém Cloudflare účtu smazat Worker a KV úložiště — tím zmizí i poslední kopie. Nikdo jiný žádnou nemá, protože nikdy nikam neodešla."],
  ["Potřebuju heslo?",
   "Ano. Celá appka je zamčená heslem, které nastavíš při prvním otevření. Cyklus má navíc vlastní heslo a je zašifrovaný.",
   "Heslo neopustí prohlížeč, server dostane jen klíč z něj odvozený. Při přihlášení vybereš, jestli jde o tvoje zařízení (pamatuje si přihlášení), nebo cizí (odhlásí se po 20 minutách nečinnosti a po zavření karty). Když heslo zapomeneš, odemkneš appku záchranným kódem, který dostaneš při nastavení. V Nastavení → Zabezpečení jde heslo změnit a odhlásit ostatní zařízení, třeba po ztrátě telefonu. Posílání z telefonu, rozšíření a widgetu jde i bez hesla, ale umí jen přidávat do Ke zpracování, nic nepřečte. Sdílené výřezy mají vlastní odkaz a můžou mít vlastní heslo."],
  ["Co když někdo získá odkaz?",
   "Hlavní adresa = vidí i mění celou tvou desku, ber ji jako klíč. Sdílený odkaz ke čtení = vidí jen tu výseč, kterou jsi mu poslala.",
   "Sdílený odkaz umí dvě nastavení, která je dobré nepomíchat. Ke čtení znamená, že příjemce vidí vybrané oblasti, cíle nebo úkoly a nic jiného; ke zbytku desky se přes ten odkaz nedostane. S úpravami může vybrané věci i měnit a mazat, což jsou tvoje opravdová data — proto se u téhle volby důrazně doporučuje heslo. Každé sdílení má vlastní platnost (24 hodin až neomezeně) a dá se kdykoli zrušit. Hlavní adresa nic takového nerozlišuje, ta je na všechno, takže ji posílej jen sobě."],
  ["Jak propojím kalendář?",
   "Jednorázově si v Google Cloud zapneš Calendar API, vytvoříš OAuth údaje a nastavíš tři secrety na Workeru. Krok za krokem je to v README.",
   "Token od Googlu leží jen na tvém Workeru v KV a do prohlížeče se nikdy neposílá. Kalendář je navíc celý schovaný za PINem (CAL_PIN) a dokud ten PIN nenastavíš, je funkce vypnutá a ani se nezobrazí. Propojení je obousměrné: události vidíš, zakládáš, měníš i mažeš. Když necháš projekt v Googlu v režimu Testing, vyžádá si Google nové přihlášení zhruba po týdnu — to není chyba appky, tak to má nastavené Google."],
  ["Jak funguje knihovna?",
   "Hledá knihy jen v legálních zdrojích (Project Gutenberg, Wikisource, Open Library / Internet Archive) a nabízí odkazy do knihoven.",
   "Žádné stínové knihovny, žádné obcházení zámků. U volných děl dostaneš rovnou soubor, u ostatních odkaz do Open Library nebo do knihovního katalogu, kde si knihu půjčíš normálně. Pozor na jednu věc, která se plete: volné dílo neznamená volný překlad — originál může být po autorských právech volný, ale konkrétní český překlad ještě chráněný. Odkazy na mlp.cz nebo Zlatý fond SME se proto nikdy nevybírají samy, jsou to jen prokliky do katalogu."],
  ["Jak funguje sdílení?",
   "Vytvoříš odkaz, který ukáže jen vybrané věci — oblasti, cíle, úkoly — ne celou stránku. Zvolíš, jestli je ke čtení, nebo i k úpravám.",
   "Odkaz je náhodný a neuhodnutelný, takže dokud ho nepošleš, nikdo ho nenajde. U soukromé varianty se navíc nastaví heslo, které se ukládá jen jako otisk, ne čitelně — pošli ho jiným kanálem než samotný odkaz. Každé sdílení má platnost 24 hodin, 7 dní, 30 dní, nebo bez konce, jde kdykoli prodloužit i zrušit a dávno prošlá se sama uklidí. Půjčené věci, dluhy, kalendář ani cyklus se sdílet nedají vůbec, do odkazu se nedostanou."],
  ["Jsou data o menstruačním cyklu soukromá?",
   "Ano. Cyklus se šifruje přímo v prohlížeči vlastním heslem k cyklu. Server, Cloudflare ani nikdo jiný bez toho hesla nevidí nic než nesrozumitelnou změť znaků.",
   "Heslo k cyklu nikam neodchází a nedá se obnovit: když ho zapomeneš, záznamy cyklu nikdo nerozšifruje a jde je jen smazat a začít znovu. Na svém zařízení si můžeš nechat klíč zapamatovat (uloží se tak, že ho skript umí použít, ale ne přečíst); Zamknout nebo odhlášení ho zapomene. Do sdílených odkazů se cyklus nedostane v žádné variantě a do zálohy jde jen zašifrovaný. Když si necháš předpověď promítnout do Google Kalendáře, appka tě napřed výslovně upozorní, že tím ta data opouštějí tvůj Cloudflare a míří k Googlu jako ke třetí straně — a musíš to potvrdit. Překryv přímo v appce nic ven neposílá. Statistiky a předpovědi jsou orientační odhad z tvých vlastních záznamů, ne lékařská rada a rozhodně ne antikoncepce."],
  ["Co dělá Hlídač na cizích webech?",
   "Jednou za zvolený interval stáhne stránky, které jsi mu zadala, vyhodí z nich HTML a podívá se, jestli v textu není tvoje fráze.",
   "Respektuje robots.txt, představuje se hlavičkou Rozcestnik-Watcher/1.0, každé stránce dá deset vteřin a na jeden běh stáhne nejvýš 25 stránek — zbytek počká na další hodinu. Nic tam o tobě nenechává: neposílá jméno, e-mail ani obsah tvé desky, jen obyčejný požadavek na stránku, jaký by poslal kdokoli jiný. Co najde, uloží se jen k tobě do KV. Obsazenost představení ti říct neumí, protože tu si divadla dokreslují JavaScriptem až v prohlížeči a Worker JavaScript nespouští — místo nespolehlivého údaje dostaneš odkaz do prodeje."],
  ["Vidí někdo, co mám půjčené a komu dlužím?",
   "Věci i Peníze jsou součástí hlavní desky, a ta je za heslem appky. Se zapnutým šifrováním obsahu jsou jména a poznámky šifrované, částky a měny zůstávají čitelné.",
   "Bez přihlášení je nikdo neuvidí. Do sdíleného odkazu se ale nedostanou nikdy: sdílet jdou jen oblasti, cíle a úkoly. Kurzy měn se stahují z veřejného kurzovního API, kterému odchází jen dotaz na kurzy — žádná jména, žádné částky, nic z tvé desky."],
],en:[
  ["Do I have to run something? Is it a virus?",
   "There is no .exe in the package, and nothing else binary either. Every file is plain text you can open in a text editor and read before running it — and you can skip the installer entirely, it is three commands in a terminal.",
   "The file 'Click this to install the app.bat' is three lines long and does nothing but launch setup\\wizard.ps1 sitting next to it. The wizard never downloads code from the internet to execute — no iex, no curl | bash. The only thing it can install is Node.js, through winget, which is Microsoft's own package manager, using the official OpenJS.NodeJS.LTS package, and only after you answer y/n. Decline and it just opens nodejs.org and leaves the rest to you. Wrangler, the tool that deploys the app, is not installed at all: it runs through npx --yes wrangler@latest, so nothing permanent is added to your system. It signs you in to Cloudflare through Cloudflare's own browser login, so neither the wizard nor anyone else sees your password. If that still doesn't sit right, skip the installer — the README has the manual route: npm install -g wrangler, wrangler login, wrangler deploy."],
  ["What does it cost?",
   "Nothing. It runs on Cloudflare's free plan, and alerts go through ntfy, which is free and needs no account. It won't push you into a paid plan.",
   "Cloudflare's free plan gives you 100,000 requests a day and an hourly cron, which is orders of magnitude more than a personal dashboard uses. One thing is built around that deliberately: the page watcher is capped at 25 fetches per cron run, because the free plan allows 50 subrequests per invocation — without that cap you would hit the limit and Cloudflare would push you to upgrade. Whatever doesn't fit waits for the next hour. Alerts via ntfy.sh are free and require no signup. E-mail through Resend is optional and has a free tier that covers a few messages a month, but nothing breaks without it."],
  ["Where does my data go?",
   "Everything lives in your own Cloudflare account (KV storage), nowhere else. The app talks only to your Worker, and nothing goes to the app's author.",
   "The exceptions, and there are no others, are these: site icons (favicons) are fetched by your own server straight from those sites, link checking visits your own saved links, Google Calendar talks to Google if you connect it, exchange rates are fetched once a day from a public rates API, and the page watcher visits the addresses you gave it yourself. In every case what leaves is a request for a page or for rates — not your name, your e-mail or the contents of your board. No analytics, no tracking scripts, no author's server; the author doesn't know you exist."],
  ["Can I delete my data? What happens?",
   "Yes. Deleted items go to the Trash for 30 days, then disappear; you can empty the Trash right away. You can also wipe everything at once.",
   "The Trash keeps each item along with where it came from, so restoring puts it back in the right area or block. After 30 days the daily cleanup discards it for good. If you want out entirely, Settings has a wipe for the whole board, and then deleting the Worker and the KV namespace in your own Cloudflare account removes the last copy. Nobody else has one, because it never went anywhere."],
  ["Do I need a password?",

   "The password never leaves the browser; the server only gets a key derived from it. When signing in you choose whether it's your device (stays signed in) or someone else's (signs out after 20 minutes idle and when the tab closes). If you forget the password, the recovery code you get at setup unlocks the app. Settings → Security lets you change the password and sign out other devices, e.g. after losing a phone. Sending from the phone, the extension and the widget works without the password, but it can only add to To process, never read. Shared slices have their own link and can carry their own password."],
  ["What if someone gets the link?",

  ["How do I connect the calendar?",

   "The Google token lives only on your Worker in KV and is never sent to the browser. The calendar is hidden behind a PIN (CAL_PIN), and until you set that PIN the feature is off and doesn't even appear. The connection is two-way: you can see, create, change and delete events. If you leave the Google project in Testing mode, Google will ask you to sign in again after about a week — that's Google's setting, not a bug in the app."],
  ["How does the library work?",
   "It searches books in legal sources only (Project Gutenberg, Wikisource, Open Library / Internet Archive) and offers links into libraries.",
   "No shadow libraries, no working around locks. For public-domain works you get the file directly; for everything else a link to Open Library or a library catalogue where you borrow the book normally. One thing that trips people up: a public-domain work does not mean a public-domain translation — the original may be free while a particular translation is still in copyright. That's why catalogue links are never selected for you automatically; they are only ways through to a library."],
  ["How does sharing work?",

  ["Is my menstrual cycle data private?",

  ["What does the Watcher do on other people's sites?",

/* ---------- Šifrování obsahu (e2e) ----------
   Datový klíč (AES-GCM) vznikne ve stránce a server ho dostane jen zabalený klíčem z hesla
   (wdk) a ze záchranného kódu (rwdk). Šifrují se jen pole s obsahem (E2E_SENS) jako tokeny
   enc1.<iv>.<šifra>; struktura, adresy, čísla a nastavení zůstávají čitelné, aby server dál
   kontroloval odkazy, hlídal a uklízel. Soukromá oblast (a.private) šifruje i adresy.
   Sdílené oblasti, bloky a úkoly (e2eShared ze serveru) se nešifrují, ať je příjemce přečte.
   Co vyrobí server sám, zamkne veřejným klíčem (pk1.…) a stránka to odemkne soukromým.
   Klíče: důvěryhodné zařízení = nevyexportovatelné CryptoKey v IndexedDB, cizí = sessionStorage. */
const E2E_SENS=new Set(["name","title","text","note","who","item","label","author","snippet","ocr","src","desc"]);
const E2E_TOK=/enc1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|pk1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g;
const e2ePlain=new Map(),e2eTok=new Map();
const b64uE=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const b64uD=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const e2eAes=(raw,use,ext)=>crypto.subtle.importKey("raw",raw,"AES-GCM",!!ext,use);
async function e2eWrap(kekRaw,data){const k=await e2eAes(kekRaw,["encrypt"]),iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64uE(iv),ct:b64uE(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,data)))};}
async function e2eUnwrapRaw(kekRaw,w){const k=await e2eAes(kekRaw,["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uD(w.iv)},k,b64uD(w.ct)));}
// Z datového klíče a zabaleného soukromého klíče udělá klíče do paměti.
async function e2eFromRaw(kid,dkRaw,keys){const dk=await e2eAes(dkRaw,["encrypt","decrypt"]);
  const pk=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uD(keys.wpriv.iv)},dk,b64uD(keys.wpriv.ct)));
  const priv=await crypto.subtle.importKey("pkcs8",pk,{name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);
  return {kid,dk,priv,pk};}
async function e2eNewKeys(){const dkRaw=crypto.getRandomValues(new Uint8Array(32)),kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);
  const pub=await crypto.subtle.exportKey("jwk",kp.publicKey),pk=new Uint8Array(await crypto.subtle.exportKey("pkcs8",kp.privateKey));
  const dk=await e2eAes(dkRaw,["encrypt","decrypt"]),iv=crypto.getRandomValues(new Uint8Array(12));
  const wpriv={iv:b64uE(iv),ct:b64uE(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},dk,pk)))};
  return {dkRaw,keys:{kid:lkRand(8),pub:{kty:"EC",crv:"P-256",x:pub.x,y:pub.y},wpriv}};}
// Uložení klíčů podle zařízení (bez surových bajtů u důvěryhodného).
async function e2eStore(kind,kid,dkRaw,keys){const k=await e2eFromRaw(kid,dkRaw,keys);
  if(kind==="f"){try{sessionStorage.setItem("rozc_k",JSON.stringify({kid,dk:b64uE(dkRaw),pk:b64uE(k.pk)}));}catch(e){}}
  else await cyIdb("readwrite",st=>st.put({kid,dk:k.dk,priv:k.priv},"e2e"));}
async function e2eLoad(keys){
  const v=await cyIdb("readonly",st=>st.get("e2e"));if(v&&v.kid===keys.kid&&v.dk&&v.priv){e2e={kid:v.kid,dk:v.dk,priv:v.priv};return true;}
  try{const s=JSON.parse(sessionStorage.getItem("rozc_k")||"null");if(s&&s.kid===keys.kid){
    e2e={kid:s.kid,dk:await e2eAes(b64uD(s.dk),["encrypt","decrypt"]),priv:await crypto.subtle.importKey("pkcs8",b64uD(s.pk),{name:"ECDH",namedCurve:"P-256"},false,["deriveBits"])};return true;}}catch(e){}
  return false;}
async function e2eForget(){e2e=null;try{sessionStorage.removeItem("rozc_k");}catch(e){}await cyIdb("readwrite",st=>st.delete("e2e"));}
// Po přihlášení: vezmi zabalené klíče a odemkni je druhou polovinou klíče z hesla.
async function e2eAfterAuth(enc,kind){const r=await lkFetch("/api/auth/status"),s=await r.json();

async function e2eEnc(s){if(typeof s!=="string"||!s||/^(enc1|pk1)\./.test(s))return s;const c=e2eTok.get(s);if(c)return c;
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},e2e.dk,new TextEncoder().encode(s)));
  const t="enc1."+b64uE(iv)+"."+b64uE(ct);e2eTok.set(s,t);e2ePlain.set(t,s);return t;}
async function e2eDecTok(t){if(e2ePlain.has(t))return e2ePlain.get(t);let out=t;
  try{const p=t.split(".");
    if(p[0]==="enc1"){out=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uD(p[1])},e2e.dk,b64uD(p[2])));e2eTok.set(out,t);}
    else{const epk=b64uD(p[1]),pub=await crypto.subtle.importKey("raw",epk,{name:"ECDH",namedCurve:"P-256"},false,[]);
      const sh=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:pub},e2e.priv,256));
      const k=await e2eAes(await crypto.subtle.digest("SHA-256",new Uint8Array([...sh,...epk])),["decrypt"]);
      out=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uD(p[2])},k,b64uD(p[3])));}}catch(e){out=t;}
  e2ePlain.set(t,out);return out;}
async function e2eOpen(v){if(!e2e)return v;
  if(typeof v==="string"){if(v.indexOf("enc1.")<0&&v.indexOf("pk1.")<0)return v;const m=new Map();for(const t of v.match(E2E_TOK)||[])m.set(t,await e2eDecTok(t));return m.size?v.replace(E2E_TOK,t=>m.get(t)):v;}
  if(Array.isArray(v)){for(let i=0;i<v.length;i++)v[i]=await e2eOpen(v[i]);return v;}
  if(v&&typeof v==="object")for(const k of Object.keys(v))v[k]=await e2eOpen(v[k]);
  return v;}
// Zašifruje kopii stavu před uložením. Vrací tentýž objekt.
async function e2eSealState(o){const b=o.board;if(!b)return o;const sh=e2eShared,priv=new Set((b.areas||[]).filter(a=>a.private).map(a=>a.id));
  b.meta=b.meta||{};b.meta.imgRefs=[...new Set((JSON.stringify(b)+JSON.stringify(o.inbox||[])).match(/\/api\/img\/[a-z0-9-]{4,40}/gi)||[])].map(x=>x.slice(9));
  const walk=async(v,pv)=>{if(Array.isArray(v)){for(const x of v)await walk(x,pv);return;}if(!v||typeof v!=="object")return;
    for(const k of Object.keys(v)){const x=v[k];if(typeof x==="string"){if(E2E_SENS.has(k)||(pv&&k==="url"))v[k]=await e2eEnc(x);}else if(x&&typeof x==="object")await walk(x,pv);}};
  for(const k of Object.keys(b)){if(k==="settings"||k==="meta")continue;
    if(k==="areas"){for(const a of b.areas)if(a.private||!sh.areas.includes(a.id))await walk(a,!!a.private);continue;}
    if(k==="blocks"){for(const x of b.blocks)if(!sh.blocks.includes(x.id))await walk(x,false);continue;}
    if(k==="tasks"&&sh.tasks)continue;
    if(k==="trash"){for(const t of b.trash)await walk(t,!!(t.payload&&priv.has(t.payload.area)));continue;}

/* Obrázky: server je drží zamčené veřejným klíčem (x-rz-enc), bajty = efemérní klíč (65)
   + iv (12) + šifra. Každé <img src="/api/img/…"> stránka hned po vložení přepne na
   odemčenou kopii (blob:, jedna na obrázek do zavření stránky), odkaz na obrázek otevře
   odemčenou kopii v nové kartě. Ctrl+V obrázek zamkne už stránka, server ho čitelně nevidí. */
const E2E_IMG=/\/api\/img\/([a-z0-9-]{4,40})/i,e2eImgs=new Map();
async function e2eOpenBytes(b){const epk=b.slice(0,65),iv=b.slice(65,77),ct=b.slice(77);
  const pub=await crypto.subtle.importKey("raw",epk,{name:"ECDH",namedCurve:"P-256"},false,[]);
  const sh=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:pub},e2e.priv,256));
  const k=await e2eAes(await crypto.subtle.digest("SHA-256",new Uint8Array([...sh,...epk])),["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct));}
async function e2eSealBytes(pubJwk,data){const pub=await crypto.subtle.importKey("jwk",{...pubJwk,ext:true},{name:"ECDH",namedCurve:"P-256"},false,[]);
  const eph=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]),epk=new Uint8Array(await crypto.subtle.exportKey("raw",eph.publicKey));
  const sh=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:pub},eph.privateKey,256));
  const k=await e2eAes(await crypto.subtle.digest("SHA-256",new Uint8Array([...sh,...epk])),["encrypt"]),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,data)),out=new Uint8Array(77+ct.length);out.set(epk);out.set(iv,65);out.set(ct,77);return out;}
// Jako fetch, ale zamčený obrázek vrátí odemčený (sealed=true, když byl zamčený).
async function e2eFetchImg(src,opts){const r=await fetch(src,opts);if(!r.ok||!r.headers.get("x-rz-enc")||!e2e)return r;
  const b=await e2eOpenBytes(new Uint8Array(await r.arrayBuffer())),t=r.headers.get("x-rz-type")||"image/webp";
  return {ok:true,status:200,sealed:true,type:t,blob:async()=>new Blob([b],{type:t})};}

function e2eFixImg(img){const m=(img.getAttribute("src")||"").match(E2E_IMG);if(!m)return;

// Dozamyká obrázky na serveru (po zapnutí šifrování, po zrušení sdílení), po dávkách.
async function e2eSealImagesLoop(){for(let i=0;i<60;i++){let r;try{r=await api("/api/e2e/seal-images",{method:"POST"});}catch(e){return;}if(!r||!r.left)return;}}
// Sdílení s čitelnými obrázky: odemčené kopie nahraje zpátky na server pod stejným id.

function artNow(){const o=look(),a=o.art;if(a.kind==="none")return null;
  if(a.kind==="paint"&&ART.length){let p=ART.find(x=>x.id===a.id)||ART[0];if(o.daytime){const ph=lookPhase(),c=ART.filter(x=>(x.tags||[]).includes(ph));if(c.length&&!(p.tags||[]).includes(ph))p=c[Math.floor(Date.now()/864e5)%c.length];}
    return {p,bg:`url("${p.file}")`,yt:p.ft||"0%",yb:p.fb||"100%",et:p.et,eb:p.eb,credit:`${lookT().credit}: ${p.author} – ${p.title}${p.year?" ("+p.year+")":""}, ${lookT().free}`};}
  if(a.kind==="grad"){const g=GRAD.find(x=>x.id===a.id)||GRAD[0];return {bg:g.css,yt:"0%",yb:"100%",et:lookWave(1,true),eb:lookWave(2,false)};}
  if(a.kind==="own"&&a.url)return {own:a.url,yt:"0%",yb:"100%",et:lookWave(3,true),eb:lookWave(4,false)};
  return null;}
function applyArt(){const t=$("artTop"),b=$("artBot"),c=$("artCredit");if(!t||!b)return;const o=look(),p=artNow(),where=o.art.where||"both";
  const set=(el,on)=>{el.classList.toggle("on",!!(p&&on));if(!p||!on){el.style.backgroundImage="";return;}el.style.setProperty("--artY",el===t?p.yt:p.yb);el.style.clipPath=artClip(el===t?p.et:p.eb,el===t);
    if(p.own){const m=p.own.match(E2E_IMG);(e2e&&m?e2eImgUrl(m[1]):Promise.resolve(p.own)).then(u=>{if(u)el.style.backgroundImage=`url("${u}")`;});}else el.style.backgroundImage=p.bg;};
  set(t,where!=="bottom");set(b,where!=="top");if(c)c.textContent=p&&p.credit?p.credit:"";artFit();
  // malý detail z obrazu vedle názvu (slunce, loď, postavy…)
  const d=$("artDetail"),dt=p&&p.p&&p.p.det;if(d){const on=!!(dt&&o.artDetail!==false);d.classList.toggle("on",on);d.parentElement.classList.toggle("has-detail",on);
    if(on){const[cx,cy,sz]=dt,sy=sz*(p.p.ar||1.4),px=(cx-sz/2)/(1-sz)*100,py=(cy-sy/2)/(1-sy)*100;
      d.style.backgroundImage=`url("${p.p.file}")`;d.style.backgroundSize=(100/sz).toFixed(1)+"% auto";d.style.backgroundPosition=`${Math.max(0,Math.min(100,px)).toFixed(1)}% ${Math.max(0,Math.min(100,py)).toFixed(1)}%`;d.title=p.credit||"";}}}
// Hrana podél linie: body v % výšky pruhu, záhlaví drží to nad linií, zápatí pod ní.
// Obraz se k obsahu přiblíží až k nejnižšímu (záhlaví) / nejvyššímu (zápatí) bodu linie.
function artFit(){const p=artNow(),t=$("artTop"),b=$("artBot");if(!t||!b)return;
  t.style.marginBottom=p&&p.et&&t.classList.contains("on")?(-Math.round(t.offsetHeight*(1-Math.max(...p.et)/100))-4)+"px":"";
  b.style.marginTop=p&&p.eb&&b.classList.contains("on")?(-Math.round(b.offsetHeight*Math.min(...p.eb)/100)-4)+"px":"";}
addEventListener("resize",()=>{clearTimeout(artFit.t);artFit.t=setTimeout(artFit,150);});
function artClip(line,top){if(!line||!line.length)return "";const n=line.length,pts=line.map((v,k)=>`${(k/(n-1)*100).toFixed(2)}% ${v}%`);
  return top?`polygon(0 0,100% 0,${pts.reverse().join(",")})`:`polygon(${pts.join(",")},100% 100%,0 100%)`;}
// U přechodů a vlastní fotky linie z obrazu není, tak jde po jemných kopcích.
function lookWave(seed,top){const out=[];for(let k=0;k<48;k++){const x=k/47;const w=Math.sin(x*Math.PI*(1.3+seed*.17)+seed)*7+Math.sin(x*Math.PI*3.1+seed*2)*3;out.push(Math.round(((top?78:22)+w)*10)/10);}return out;}

async function artUpload(file){const T=lookT(),lbl=$("artUpLbl");if(lbl)lbl.textContent=T.uploading;
  try{const bmp=await createImageBitmap(file),k=Math.min(1,2000/bmp.width),c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/webp",.82));let body=new Uint8Array(await blob.arrayBuffer());const h={"content-type":"image/webp"};
    if(e2e&&lkInfo&&lkInfo.keys&&lkInfo.keys.pub){body=await e2eSealBytes(lkInfo.keys.pub,body);h["x-rz-enc"]="1";}
    const id="art-"+lkRand(8),r=await fetch("/api/img/"+id,{method:"PUT",headers:h,body});if(!r.ok)throw new Error(r.status);
    const o=look(),old=o.art.kind==="own"&&o.art.id;o.art={kind:"own",id,url:"/api/img/"+id,where:o.art.where||"both"};save();applyArt();artGallery();
